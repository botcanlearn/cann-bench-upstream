operator:
  name: Trmv
  category: Contraction
  difficulty: L2
  formula: x := op(A) * x，其中 op(A) ∈ {A, A^T, A^H}，x 原地覆写
  description: 三角矩阵-向量乘法（Triangular Matrix-Vector Multiplication），支持上/下三角、单位/非单位对角线、转置与共轭转置
  shape_support: A 为 n×lda 二维张量（仅 uplo 指定三角被引用）；x 为长度 (n-1)*|incx|+1 的一维向量
  attrs:
  - name: uplo
    type: str
    default: LOWER
    description: 指定 A 的三角部分：UPPER(121) 上三角；LOWER(122) 下三角
  - name: trans
    type: str
    default: N
    description: op(A) 的形式：N(111) 不转置；T(112) 转置 A^T；C(113) 共轭转置 A^H（FP32 下与 T 等价）
  - name: diag
    type: str
    default: NON_UNIT
    description: 对角线语义：NON_UNIT(131) 对角元从 A 读取；UNIT(132) 对角元固定为 1
  - name: incx
    type: int
    default: 1
    description: x 的存储增量，不可为 0（Ctrmv 仅支持 >0）
  inputs:
  - name: A
    description: n×lda 三角矩阵，列主序存储（A(i,j) 位于 buf[i+j*lda]），仅 uplo 指定的三角部分被访问
    dtype:
    - float32
    - complex64
  - name: x
    description: 输入向量（按 incx 步长访问），输出原地覆写为 op(A)*x
    dtype:
    - float32
    - complex64
  outputs:
  - name: x
    description: 结果向量（原地覆写输入 x，未按 incx 步长访问的位置保持输入值不变）
    dtype:
    - float32
    - complex64
  schema: trmv(Tensor A, Tensor x, str uplo, str trans, str diag, int incx) -> Tensor x
  precision_thresholds:
    float32: 0.005
    complex64: 0.01
