operator:
  name: Tbmv
  category: Contraction
  difficulty: L2
  formula: y = op(A) * x，A 为半带宽 k 的三角带状矩阵，op(A) ∈ {A, A^T, A^H}
  description: 三角带状矩阵-向量乘法（Triangular Band Matrix-Vector Multiplication），支持上/下三角、单位/非单位对角线、转置与共轭转置；arch22 为 x/y 分离输出
  shape_support: A 为 lda×n 带状打包缓冲（lda ≥ k+1）；x 为长度 (n-1)*|incx|+1 的一维向量
  attrs:
  - name: uplo
    type: str
    default: LOWER
    required: false
    description: 指定 A 的三角部分：UPPER(121) 上三角；LOWER(122) 下三角
  - name: trans
    type: str
    default: N
    required: false
    description: op(A) 的形式：N(111) 不转置；T(112) 转置 A^T；C(113) 共轭转置 A^H（FP32 下与 T 等价）
  - name: diag
    type: str
    default: NON_UNIT
    required: false
    description: 对角线语义：NON_UNIT(131) 对角元从 A 读取；UNIT(132) 对角元固定为 1
  - name: k
    type: int
    default: 0
    required: false
    description: 三角带状矩阵的半带宽，k ≥ 0；k=0 为纯对角，k=n-1 退化为满三角
  - name: incx
    type: int
    default: 1
    required: false
    description: x 的存储增量，不可为 0
  inputs:
  - name: A
    description: lda×n 带状打包缓冲，列主序带状存储（BLAS 标准，下三角 A(i,j) 位于 buf[(i-j)+j*lda]，上三角位于 buf[(k+i-j)+j*lda]，以 README 调用示例解码验证）
    dtype:
    - float32
  - name: x
    description: 输入向量（按 incx 步长访问）
    dtype:
    - float32
  outputs:
  - name: y
    description: 结果向量（arch22 为 x/y 分离输出，不覆写 x；y 的 incx 仅为存储布局，数学结果与 incx 无关）
    dtype:
    - float32
  schema: tbmv(Tensor A, Tensor x, str uplo, str trans, str diag, int k, int incx) -> Tensor y
  precision_thresholds:
    float32: 0.005
