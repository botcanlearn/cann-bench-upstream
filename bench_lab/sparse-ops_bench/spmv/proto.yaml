operator:
  name: Spmv
  category: Contraction
  difficulty: L3
  formula: y_out = alpha * op(A) * x + beta * y
  description: 稀疏矩阵-稠密向量乘（SpMV），A 为 CSR 格式稀疏矩阵，支持转置与 alpha/beta 缩放，对应 aclsparseSpMV
  shape_support: '非转置：x [N]，y [M]；转置：x [M]，y [N]；csr_row_ptr [M+1]，csr_col_ind/csr_val [nnzA]，nnzA <= M*N；输出与 y 同 shape'
  attrs:
  - name: alpha
    type: float
    default: 1.0
    description: 标量系数 alpha，乘在 op(A)*x 上
    required: false
  - name: beta
    type: float
    default: 0.0
    description: 标量系数 beta，乘在输入 y 上
    required: false
  - name: transpose
    type: bool
    default: "false"
    description: true=op(A)=Aᵀ（转置模式），false=op(A)=A（非转置）；对应 aclsparseSpMV 的 opA
    required: false
  inputs:
  - name: csr_row_ptr
    description: CSR 行偏移数组，int32，shape [M+1]，单调不减，csr_row_ptr[M] = nnzA
    dtype:
    - int32
  - name: csr_col_ind
    description: CSR 列索引数组，int32，shape [nnzA]，每行内严格升序且唯一，取值 [0, N-1]
    dtype:
    - int32
  - name: csr_val
    description: CSR 非零元值数组，与 x 的 dtype 一致
    dtype:
    - float16
    - float32
    - bfloat16
  - name: x
    description: 输入稠密向量（非转置长度 N，转置长度 M），与 csr_val 的 dtype 一致
    dtype:
    - float16
    - float32
    - bfloat16
  - name: y
    description: 输入/输出稠密向量（非转置长度 M，转置长度 N），beta*y 的被乘向量，结果写回同 shape
    dtype:
    - float16
    - float32
    - bfloat16
  outputs:
  - name: y_out
    description: 结果向量，shape 与 y 相同；dtype 与输入 y 一致（fp16/bf16 输入按 computeType=ACL_FLOAT 以 FP32 累加后写回）
    dtype:
    - float16
    - float32
    - bfloat16
  schema: spmv(Tensor csr_row_ptr, Tensor csr_col_ind, Tensor csr_val, Tensor x, Tensor y, float alpha=1.0, float beta=0.0, bool transpose=false) -> Tensor y_out
  note: 对应 aclsparseSpMV（ops-sparse sparse/spmv/arch22）：格式固定 CSR、索引类型固定 ACL_SPARSE_INDEX_32I、idxBase 固定 ACL_SPARSE_INDEX_BASE_ZERO、alg 固定 ACL_SPARSE_SPMV_ALG_DEFAULT。FP16/BF16 输入按 computeType=ACL_FLOAT 以 FP32 乘累加（ReduceSum 固定 float 精度）后写回 y dtype；单行非零元数受 kernel UB 容量限制（用例已避开）。原接口的 int32 精确整数计算路径（computeType=ACL_INT32）不在本任务覆盖范围。CSR 结构（行偏移单调、行内列索引升序唯一）由 get_input 规整保证。
