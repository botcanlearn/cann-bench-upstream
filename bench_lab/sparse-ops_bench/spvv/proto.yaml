operator:
  name: Spvv
  category: Reduction
  difficulty: L2
  formula: result = sum_{i=0}^{nnz-1} values[i] * y[indices[i]]
  description: 稀疏向量-稠密向量点积（SPVV），稀疏向量以 (indices, values) 非零元对表示，结果恒为 FP32 标量
  shape_support: 'indices/values: [nnz]，y: [yLen]，0 <= nnz <= yLen；输出 [1]'
  inputs:
  - name: indices
    description: 稀疏向量 x 的非零元素索引，int32，须严格升序且唯一，取值范围 [0, yLen-1]
    dtype:
    - int32
  - name: values
    description: 稀疏向量 x 的非零元素值，与 y 的 dtype 一致
    dtype:
    - float16
    - float32
  - name: y
    description: 稠密向量
    dtype:
    - float16
    - float32
  outputs:
  - name: result
    description: 点积标量结果，shape [1]，dtype 恒为 float32（与输入 dtype 无关）
    dtype:
    - float32
  schema: spvv(Tensor indices, Tensor values, Tensor y) -> Tensor result
  note: 对应 aclsparseSpvv（ops-sparse sparse/spvv/arch22）：op 固定 ACL_SPARSE_OP_NON_TRANSPOSE、idxType 固定 ACL_SPARSE_INDEX_32I、idxBase 固定 ACL_SPARSE_INDEX_BASE_ZERO、computeType 固定 ACL_FLOAT（FP16 输入先 Cast 到 FP32 再乘累加，累加与输出恒为 FP32）。indices 的升序唯一性与 nnz <= yLen 由 get_input 规整保证。
