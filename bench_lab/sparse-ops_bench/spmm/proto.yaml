operator:
  name: Spmm
  category: Contraction
  difficulty: L3
  formula: c_out = alpha * op(A) * op(B) + beta * c
  description: 稀疏矩阵-稠密矩阵乘（SpMM），A 为 CSR 格式稀疏矩阵，B/C 为行主序稠密矩阵，支持 op(A)=Aᵀ 与 op(B)=Bᵀ 及 alpha/beta 缩放，对应 aclsparseSpMM
  shape_support: 'A 存储为 M×K CSR（csr_row_ptr [M+1]，csr_col_ind/csr_val [nnzA]）；op(A) 行数 P=M（transpose_a=false）或 K（true）；c/c_out [P, N]；b：transpose_b=false 时 [op(A)列数, N]，true 时 [N, op(A)列数]，op(A)列数 = K（transpose_a=false）或 M（true）；nnzA <= M*K'
  attrs:
  - name: alpha
    type: float
    default: 1.0
    description: 标量系数 alpha，乘在 op(A)*op(B) 上
    required: false
  - name: beta
    type: float
    default: 0.0
    description: 标量系数 beta，乘在输入 c 上
    required: false
  - name: transpose_a
    type: bool
    default: "false"
    description: false=op(A)=A（A 存储 M×K），true=op(A)=Aᵀ（A 仍以 M×K CSR 存储，逻辑转置后为 K×M）；对应 aclsparseSpMM 的 opA
    required: false
  - name: transpose_b
    type: bool
    default: "false"
    description: false=op(B)=B（b 存储为 [op(A)列数, N]），true=op(B)=Bᵀ（b 存储为 [N, op(A)列数]）；对应 aclsparseSpMM 的 opB
    required: false
  inputs:
  - name: csr_row_ptr
    description: CSR 行偏移数组，int32，shape [M+1]，单调不减，csr_row_ptr[M] = nnzA
    dtype:
    - int32
  - name: csr_col_ind
    description: CSR 列索引数组，int32，shape [nnzA]，每行内严格升序且唯一，取值 [0, K-1]（以存储的 M×K 为准，与 transpose_a 无关）
    dtype:
    - int32
  - name: csr_val
    description: CSR 非零元值数组，与 b/c 的 dtype 一致
    dtype:
    - float16
    - float32
  - name: b
    description: 输入稠密矩阵（行主序紧凑布局）；transpose_b=false 时 [op(A)列数, N]，transpose_b=true 时 [N, op(A)列数]，与 csr_val 的 dtype 一致
    dtype:
    - float16
    - float32
  - name: c
    description: 输入/输出稠密矩阵（行主序，beta*c 的被乘矩阵），shape [P, N]（P=op(A) 行数），结果写回同 shape
    dtype:
    - float16
    - float32
  outputs:
  - name: c_out
    description: 结果矩阵，shape [P, N] 与 c 相同；dtype 与输入 c 一致（FP16 输入按 computeType=ACL_FLOAT 以 FP32 累加后写回）
    dtype:
    - float16
    - float32
  schema: spmm(Tensor csr_row_ptr, Tensor csr_col_ind, Tensor csr_val, Tensor b, Tensor c, float alpha=1.0, float beta=0.0, bool transpose_a=false, bool transpose_b=false) -> Tensor c_out
  note: 对应 aclsparseSpMM（ops-sparse sparse/spmm/）：格式固定 CSR、索引类型固定 ACL_SPARSE_INDEX_32I、idxBase 固定 ACL_SPARSE_INDEX_BASE_ZERO；opA/opB 支持 NON_TRANSPOSE 与 TRANSPOSE（不区分 arch 实现差异，按算子数学契约建模）；b/c 固定紧凑行主序（ACL_SPARSE_ORDER_ROW 且 ld=cols）。FP16 输入按 computeType=ACL_FLOAT 以 FP32 乘累加后写回 c dtype。原接口的 int8→int32 精确整数路径（computeType=ACL_INT32）与列主序/带 padding 布局不在本任务覆盖范围。CSR 结构（行偏移单调、行内列索引升序唯一）由 get_input 规整保证。
