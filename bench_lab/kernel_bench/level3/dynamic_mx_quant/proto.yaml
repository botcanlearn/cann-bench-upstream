operator:
  name: DynamicMxQuant
  category: FusedComposite
  difficulty: L3
  formula: |
    shared_exp = floor(log2(max_i(|V_i|))) - emax          # 标准 OCP MX 算法, i 遍历一个 block
    mxscale = 2^shared_exp                                  # E8M0
    P_i = cast_to_dst_type(V_i / mxscale, round_mode)
  description: |
    MX (microscaling) 动态量化：在给定轴 axis 上按 blocksize 分块，每块计算 E8M0 共享尺度
    mxscale，块内元素除以 mxscale 后按 round_mode 舍入到 dst_type (FP8)。采用标准 OCP MX
    算法（floor(log2(amax)) - emax），不支持其他 scale 算法。
    FP4 目标类型 (dst_type=40/41) 不在本任务范围（torch CPU golden 无法表示 packed FP4，
    见 desc.md 规则与约束）。
  shape_support: |
    x: 1-7 维 ND；输出 y: 同 x；输出 mxscale: rank 与 x 一致，
    量化轴维 = ceil(x.shape[axis]/blocksize)，其余维度与 x 一致
  attrs:
  - name: axis
    type: int64
    description: 量化发生的轴，取值 [-D, D-1]，D 为 x 的维数
    required: true
  - name: round_mode
    type: string
    default: rint
    description: 舍入模式；FP8 目标类型仅支持 "rint"
    required: false
  - name: dst_type
    type: int64
    description: '目标数据类型枚举：35=float8_e5m2, 36=float8_e4m3fn（40/41=FP4 不支持）'
    required: true
  - name: blocksize
    type: int64
    description: 每次量化的元素个数，须为 32 的倍数且不超过 1024；x 为 float32 时必须为 32
    required: true
  inputs:
  - name: x
    description: 待量化数据；float32 输入仅支持 blocksize=32 且量化轴维度不小于 32
    dtype:
    - float16
    - bfloat16
    - float32
  outputs:
  - name: y
    description: 量化后的张量，shape 与 x 一致
    dtype:
    - float8_e4m3fn
    - float8_e5m2
  - name: mxscale
    description: 每个分组对应的量化尺度 (E8M0)，rank 与 x 一致，量化轴维 = ceil(x.shape[axis]/blocksize)
    dtype:
    - float8_e8m0fnu
  schema: dynamic_mx_quant(Tensor x, int axis, str round_mode, int dst_type, int blocksize)
    -> (Tensor y, Tensor mxscale)
