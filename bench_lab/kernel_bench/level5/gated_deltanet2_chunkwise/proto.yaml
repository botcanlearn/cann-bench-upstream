operator:
  name: GatedDeltaNet2Chunkwise
  category: FusedComposite
  difficulty: L5
  formula: |
    q̂_t = q_t / (‖q_t‖₂ + 1e-6),  k̂_t = k_t / (‖k_t‖₂ + 1e-6)   # 沿 Dk 做 L2 归一化
    S̄_t = Diag(α_t) S_{t-1}，α_t = exp(g_t) ∈ (0, 1)              # 按 Dk 行逐通道衰减
    e_t = b_t ⊙ k̂_t，r_t = S̄_tᵀ e_t                               # 通道级 erase 读出
    z_t = w_t ⊙ v_t                                               # 通道级 write
    S_t = S̄_t + k̂_t (z_t − r_t)ᵀ                                  # delta-rule 状态更新，S_0 = 0
    o_t = S_tᵀ q̂_t                                                # 输出读出
  description: Gated DeltaNet-2 线性注意力前向，通道级 erase/write 双门 + 通道级衰减的 delta-rule 状态递归（chunkwise kernel）
  shape_support: "q/k/erase_gate/log_decay [B, L, H, Dk]，v/write_gate [B, L, H, Dv]，输出 y [B, L, H, Dv]、final_state [B, H, Dk, Dv]"
  # 长递归链（L 最长 8192）+ chunkwise 分块实现（块内下三角系统 + 块间状态传递）与朴素
  # 逐 token 递归的求和顺序不同，误差随序列累积。阈值用仓库 checker
  # (kernel_eval.utils.compare.compare_tensors, native=plain golden) 实测确定：
  # fp32 数据通路（状态/反馈 fp32）的误差下限在 L=2048~4096、Dk=Dv=128 下为
  # bf16 MERE≈1e-6 / MARE≈5.7e-2，fp16 MERE≈1.3e-7 / MARE≈7.0e-3，
  # fp32 MERE≈1.0e-6（MARE 尖峰位于相消/小值域，由评测框架兜底标准处理）；
  # 中间量整体降 bf16 时实测 MERE 达 3e-2 且小值域兜底必失败，故要求状态与
  # delta 反馈路径以 fp32 保存/累加。取 bfloat16 0.02（MARE 阈值 0.2 覆盖实测
  # 5.7e-2）、float16 0.005（MARE 阈值 0.05 覆盖实测 7.0e-3）、float32 0.001，
  # 与同类先例 mamba2_ssd（bf16 0.02 / fp32 0.001）一致。
  precision_thresholds:
    float32: 0.001
    float16: 0.005
    bfloat16: 0.02
  attrs:
  - name: chunk_size
    type: int
    default: 64
    description: chunkwise 分块大小，仅约束 kernel 的分块实现（块内三角系统 + 块间状态传递），不影响数学结果
    required: false
  inputs:
  - name: q
    description: 查询张量，算子内部沿 Dk 做 L2 归一化（q̂）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, L, H, Dk]"
  - name: k
    description: 键张量，算子内部沿 Dk 做 L2 归一化（k̂）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, L, H, Dk]"
  - name: v
    description: 值张量
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, L, H, Dv]"
  - name: erase_gate
    description: 通道级 erase 门 b_t，要求 ∈ (0, 1)（评测取值范围 [0.05, 0.95]），作用于 Dk 通道
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, L, H, Dk]"
  - name: write_gate
    description: 通道级 write 门 w_t，要求 ∈ (0, 1)（评测取值范围 [0.05, 0.95]），作用于 Dv 通道
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, L, H, Dv]"
  - name: log_decay
    description: 通道级对数衰减 g_t，要求 ≤ 0（评测取值范围 [-0.5, -0.001]），α_t = exp(g_t) ∈ (0, 1)
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, L, H, Dk]"
  outputs:
  - name: y
    description: 输出序列 o_t 沿 L 拼接，dtype 与 q 一致
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, L, H, Dv]"
  - name: final_state
    description: 序列末尾的递归状态 S_L，dtype 与 q 一致
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, H, Dk, Dv]"
  schema: gated_deltanet2_chunkwise(Tensor q, Tensor k, Tensor v, Tensor erase_gate, Tensor write_gate, Tensor log_decay, int chunk_size=64) -> (Tensor y, Tensor final_state)
