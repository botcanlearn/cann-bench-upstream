operator:
  name: SpeculativeVerifyStep
  category: FusedComposite
  difficulty: L5
  formula: |
    P_t[i] = p_target[b,i] / S_t[i]，P_d[i] = p_draft[b,i] / S_d[i]     # 沿 V 归一化，S 为前缀和末元素
    验证 i = 0..T-1: tok = draft_tokens[b,i]
      接受 ⇔ accept_noise[b,i] · P_d[i][tok] < P_t[i][tok]             # 单次乘法 + 比较
    首次拒绝于 i: r = max(P_t[i] − P_d[i], 0)（恰全零则 r = P_t[i]）
    全接受:       r = P_t[T]                                            # bonus 分布
    c = cumsum(r)，sel = min{ j : c[j] > resample_noise[b] · c[V-1] }   # 逆 CDF
    accept_len[b] = 接受个数；output_tokens[b] = 接受前缀 + sel + 补 -1
  description: 投机解码验证步，对 draft token 做标准拒绝采样验证 + 残差/bonus 逆 CDF 重采样，数据依赖控制流，整数输出零容差
  shape_support: "draft_tokens [B, T] int32，p_target [B, T+1, V]，p_draft [B, T, V]，accept_noise [B, T]，resample_noise [B]（float32），输出 accept_len [B]、output_tokens [B, T+1]（int32）"
  # 两个输出均为 int32 结构输出，阈值 0（完全相等，一处不等即失败）。可行性依据：
  # 判定链中每一步都被定义为单次 IEEE 精确舍入运算（乘法/除法/比较）或"升序 ≥fp64 累加、
  # 逐前缀舍回 fp32"的前缀和（torch CPU cumsum 语义，等价于 fp32 权重精确和的正确舍入，
  # 对归约顺序不敏感）。fp32 舍入粒度是算子语义的一部分：oracle 与 plain 复用同一 fp32
  # 判定核心（fp64_cpu 下无损升精度的输入舍回 fp32 即逐位还原，参考输出与 plain 逐位一致）。
  # 实测全部 100 个 case 配置 × 多种子（42630 判定行 / 4935 次逆 CDF 采样）：接受判定
  # fp32 vs fp64 零翻转、最小相对裕度 3.6e-5；逆 CDF 桶宽 ~1/V 对判定精度提升敏感，
  # 故由规格固定为 fp32 粒度（见 desc.md §4 数据）。
  precision_thresholds:
    int32: 0
  inputs:
  - name: draft_tokens
    description: draft 模型产出的候选 token，取值 [0, V-1]（V 由 p_target 末维决定）
    dtype:
    - int32
    shape: "[B, T]"
  - name: p_target
    description: target 模型的非负未归一权重（算子内部沿 V 归一化），行 0..T-1 用于验证，行 T 用于 bonus 采样；评测取值范围 [0.0001, 1.0]
    dtype:
    - float32
    shape: "[B, T+1, V]"
  - name: p_draft
    description: draft 模型的非负未归一权重（算子内部沿 V 归一化）；评测取值范围 [0.0001, 1.0]
    dtype:
    - float32
    shape: "[B, T, V]"
  - name: accept_noise
    description: 接受判定随机数，取值 (0, 1)（评测取值范围 [0.0001, 0.9999]），由框架作为输入传入以保证可复现
    dtype:
    - float32
    shape: "[B, T]"
  - name: resample_noise
    description: 残差重采样 / bonus 采样随机数，取值 (0, 1)（评测取值范围 [0.0001, 0.9999]）
    dtype:
    - float32
    shape: "[B]"
  outputs:
  - name: accept_len
    description: 每个 batch 接受的 draft token 个数（0..T），零容差精确比对
    dtype:
    - int32
    shape: "[B]"
  - name: output_tokens
    description: 前 accept_len 个接受 token + 1 个修正/bonus token，其余填 -1，零容差精确比对
    dtype:
    - int32
    shape: "[B, T+1]"
  schema: speculative_verify_step(Tensor draft_tokens, Tensor p_target, Tensor p_draft, Tensor accept_noise, Tensor resample_noise) -> (Tensor accept_len, Tensor output_tokens)
