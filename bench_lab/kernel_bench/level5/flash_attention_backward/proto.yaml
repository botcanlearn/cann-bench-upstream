operator:
  name: FlashAttentionBackward
  category: FusedComposite
  difficulty: L5
  formula: |
    前向重算: S = Q @ K^T * scaleValue (+ causal mask)
              P = softmax(S)
              O = P @ V
    反向:     dV = P^T @ dO
              dP = dO @ V^T
              Delta = rowsum(dO ⊙ O)
              dS = P ⊙ (dP - Delta)
              dQ = dS @ K * scaleValue
              dK = dS^T @ Q * scaleValue
  description: FlashAttention 反向传播算子（FA2 反向公式），前向 P/O/LSE 由算子内部重算，输出 dQ/dK/dV
  shape_support: "BNSD: query/key/value/dy 均为 [B, N, S, D]，输出 dq/dk/dv 同 shape"
  # 反向链路含 5 次链式矩阵乘 + softmax 重算 + (dP - Delta) 相消项，低精度输入下误差
  # 沿链路逐级放大；相对生态标准适度放宽（float16/bfloat16 0.01，MARE 阈值 = 0.1；
  # float32 0.001，MARE 阈值 = 0.01）。
  precision_thresholds:
    float32: 0.001
    float16: 0.01
    bfloat16: 0.01
  attrs:
  - name: scaleValue
    type: float
    description: 缩放因子，通常为 1/sqrt(D)
    required: true
  - name: is_causal
    type: bool
    default: false
    description: 是否启用因果掩码（下三角），True 时前向重算与反向均屏蔽 j > i 的位置
    required: false
  inputs:
  - name: query
    description: 前向查询张量 Q
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, N, S, D]"
  - name: key
    description: 前向键张量 K，shape 与 query 一致
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, N, S, D]"
  - name: value
    description: 前向值张量 V，shape 与 query 一致
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, N, S, D]"
  - name: dy
    description: 上游梯度 dO（对前向输出 O 的梯度），shape 与 query 一致
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, N, S, D]"
  outputs:
  - name: dq
    description: query 的梯度
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, N, S, D]"
  - name: dk
    description: key 的梯度
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, N, S, D]"
  - name: dv
    description: value 的梯度
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, N, S, D]"
  schema: flash_attention_backward(Tensor query, Tensor key, Tensor value, Tensor dy, float scaleValue, bool is_causal=False) -> (Tensor dq, Tensor dk, Tensor dv)
