operator:
  name: ColocatedPrefillDecode
  category: FusedComposite
  difficulty: L5
  formula: |
    负载 A（prefill 层，因果自注意力，仅消费 *_a 输入）：
      h  = RMSNorm(x_a, γ1_a, ε)                                    # 沿 H_a，rms = sqrt(mean(x²)+ε)
      q  = RoPE(h @ wq_a)，k = RoPE(h @ wk_a)，v = h @ wv_a           # 半维旋转，cos/sin [B_a,S_a,D_a] 已逐位置索引
      attn = CausalGQA(q, k, v) @ wo_a                               # scale=D_a^-0.5，头 n 的 KV 头 g = n//(Nq_a/Nkv_a)
      x2 = x_a + attn；y_a = x2 + SwiGLU(RMSNorm(x2, γ2_a, ε))        # SwiGLU = (SiLU(h2@w_gate)⊙(h2@w_up))@w_down
    负载 B（单 token decode 层 + KV cache 追加，仅消费 *_b/cache 输入）：
      k_cache_out[b, :, cache_len[b], :] = k_new[b]（v 同）            # 其余槽位逐位保持输入值
      attn = GQA(q_b, k_cache_out, v_cache_out, L_b = cache_len[b]+1) @ wo_b
      y_b 同负载 A 的残差 + RMSNorm + SwiGLU 结构
    独立性契约：y_a 仅由 A 侧输入决定；y_b/k_cache_out/v_cache_out 仅由 B 侧输入决定
  description: 双模型同 die 共驻（colocated serving）融合算子：一次调用同时执行 prefill 模型的一个完整 pre-norm decoder 层（GEMM 密集）与 decode 模型的单 token 解码层（KV cache 追加 + 变长 GQA，带宽/向量密集），两个负载数学上完全独立
  shape_support: "x_a [B_a, S_a, H_a]，x_b [B_b, 1, H_b]，k_cache/v_cache [B_b, Nkv_b, Smax, D_b]，cache_len [B_b] int32，输出 y_a、y_b 与更新后的两个 cache"
  # 阈值用仓库 checker (kernel_eval.utils.compare.compare_tensors, native=plain golden)
  # 实测确定：plain golden（fp32 数据通路）对 fp64 oracle 的误差下限，在公开 case 量级
  # （A: H_a=1024/2048、S_a=512/1024；B: H_b=1024/2048、Smax=1024/2048、B_b=8/16）下为
  # bf16 MERE≈5.6e-7~1.3e-6 / MARE≈7.8e-3（尖峰位于两处残差与 softmax 加权和的相消位置），
  # fp16 MERE≈8.6e-7~2.8e-6 / MARE≈9.8e-4~3.0e-3，
  # fp32 MERE≈1.3e-6~2.5e-6 / MARE≈1.1e-4~1.2e-3（小值域由评测框架兜底标准处理）。
  # 换一种求和顺序的正确实现需要余量，取 bfloat16 0.01（MARE 上限 0.1 为实测下限的 ~13 倍）、
  # float16 0.005（上限 0.05 为实测的 ~17 倍）、float32 0.001（上限 0.01 为实测的 ~8 倍），
  # 与同类先例 decoder_layer_megakernel（bf16 0.01 / fp16 0.005 / fp32 0.001）一致。
  # k_cache_out / v_cache_out 除写入槽位外逐位等于输入，未写槽位被改动会被
  # MARE 上限直接判失败（已负测试验证）。
  precision_thresholds:
    float32: 0.001
    float16: 0.005
    bfloat16: 0.01
  attrs:
  - name: epsilon
    type: float
    default: 1e-6
    description: 四处 RMSNorm（A/B 各两处）的 epsilon（加在均方内）
    required: false
  inputs:
  - name: x_a
    description: 负载 A（prefill 层）输入 hidden states
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B_a, S_a, H_a]"
  - name: gamma1_a
    description: A 侧 attention 前 RMSNorm 的缩放参数 γ1
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_a]"
  - name: wq_a
    description: A 侧 query 投影权重，列按头拼接（头 n 占列 n*D_a..(n+1)*D_a-1）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_a, Nq_a*D_a]"
  - name: wk_a
    description: A 侧 key 投影权重，列按 KV 头拼接（GQA，Nq_a % Nkv_a == 0）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_a, Nkv_a*D_a]"
  - name: wv_a
    description: A 侧 value 投影权重，列按 KV 头拼接
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_a, Nkv_a*D_a]"
  - name: wo_a
    description: A 侧 attention 输出投影权重
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[Nq_a*D_a, H_a]"
  - name: gamma2_a
    description: A 侧 MLP 前 RMSNorm 的缩放参数 γ2
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_a]"
  - name: w_gate_a
    description: A 侧 SwiGLU gate 投影权重
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_a, F_a]"
  - name: w_up_a
    description: A 侧 SwiGLU up 投影权重
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_a, F_a]"
  - name: w_down_a
    description: A 侧 SwiGLU down 投影权重
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[F_a, H_a]"
  - name: x_b
    description: 负载 B（decode 层）输入 hidden states（单 token 解码，S_q = 1）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B_b, 1, H_b]"
  - name: gamma1_b
    description: B 侧 attention 前 RMSNorm 的缩放参数 γ1
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_b]"
  - name: wq_b
    description: B 侧 query 投影权重，列按头拼接
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_b, Nq_b*D_b]"
  - name: wk_b
    description: B 侧 key 投影权重，列按 KV 头拼接（GQA，Nq_b % Nkv_b == 0）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_b, Nkv_b*D_b]"
  - name: wv_b
    description: B 侧 value 投影权重，列按 KV 头拼接
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_b, Nkv_b*D_b]"
  - name: wo_b
    description: B 侧 attention 输出投影权重
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[Nq_b*D_b, H_b]"
  - name: gamma2_b
    description: B 侧 MLP 前 RMSNorm 的缩放参数 γ2
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_b]"
  - name: w_gate_b
    description: B 侧 SwiGLU gate 投影权重
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_b, F_b]"
  - name: w_up_b
    description: B 侧 SwiGLU up 投影权重
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H_b, F_b]"
  - name: w_down_b
    description: B 侧 SwiGLU down 投影权重
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[F_b, H_b]"
  - name: k_cache
    description: key cache，样本 b 的有效位置为 0..cache_len[b]-1，本步写入槽位 cache_len[b]，其余槽位逐位保持输入值
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B_b, Nkv_b, Smax, D_b]"
  - name: v_cache
    description: value cache（追加语义与 k_cache 相同）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B_b, Nkv_b, Smax, D_b]"
  - name: cache_len
    description: 各样本已有的有效 cache 长度，∈ [1, Smax-1]（由评测 value_range 保证，写入槽位恒合法）
    dtype:
    - int32
    shape: "[B_b]"
  - name: rope_cos_a
    description: A 侧 RoPE 余弦（已逐位置索引好，golden 直接使用）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B_a, S_a, D_a]"
  - name: rope_sin_a
    description: A 侧 RoPE 正弦（已逐位置索引好）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B_a, S_a, D_a]"
  - name: rope_cos_b
    description: B 侧 RoPE 余弦（已按各样本当前位置索引好）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B_b, D_b]"
  - name: rope_sin_b
    description: B 侧 RoPE 正弦（已按各样本当前位置索引好）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B_b, D_b]"
  outputs:
  - name: y_a
    description: 负载 A 输出 hidden states，dtype 与 x_a 一致，仅由 A 侧输入决定
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B_a, S_a, H_a]"
  - name: y_b
    description: 负载 B 输出 hidden states，dtype 与 x_b 一致，仅由 B 侧输入决定
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B_b, 1, H_b]"
  - name: k_cache_out
    description: 追加后的 key cache，shape/dtype 与 k_cache 一致；除写入槽位外逐位等于输入
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B_b, Nkv_b, Smax, D_b]"
  - name: v_cache_out
    description: 追加后的 value cache，shape/dtype 与 v_cache 一致；除写入槽位外逐位等于输入
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B_b, Nkv_b, Smax, D_b]"
  schema: colocated_prefill_decode(Tensor x_a, Tensor gamma1_a, Tensor wq_a, Tensor wk_a, Tensor wv_a, Tensor wo_a, Tensor gamma2_a, Tensor w_gate_a, Tensor w_up_a, Tensor w_down_a, Tensor x_b, Tensor gamma1_b, Tensor wq_b, Tensor wk_b, Tensor wv_b, Tensor wo_b, Tensor gamma2_b, Tensor w_gate_b, Tensor w_up_b, Tensor w_down_b, Tensor k_cache, Tensor v_cache, Tensor cache_len, Tensor rope_cos_a, Tensor rope_sin_a, Tensor rope_cos_b, Tensor rope_sin_b, float epsilon=1e-6) -> (Tensor y_a, Tensor y_b, Tensor k_cache_out, Tensor v_cache_out)
