operator:
  name: RtmWaveStencil
  category: FusedComposite
  difficulty: L5
  formula: |
    每步（8 阶标准 FD 系数 c0=-205/72, c1=8/5, c2=-1/5, c3=8/315, c4=-1/560）:
      lap[i,j] = ( 2*c0*p[i,j] + Σ_{k=1..4} c_k*((p[i-k,j]+p[i+k,j]) + (p[i,j-k]+p[i,j+k])) ) / dx²
      p_next = (2*p_curr − p_prev + (v*dt)² * lap) * g，g[i,j] = 1/(1 + damp_z[i] + damp_x[j])
    边界: p 的最外 4 圈恒为 0（第一步前对输入置 0，每步更新后对 p_next 置 0）
    滚动: p_prev ← p_curr，p_curr ← p_next；重复 num_steps 次，输出最终两个时间片
  description: 地震逆时偏移（RTM）核心 kernel——二维声波方程 8 阶空间中心差分显式时间步进 + 简化 Cerjan 型海绵吸收边界，num_steps 步全场时间推进
  shape_support: "p_prev/p_curr/velocity [B, Nz, Nx]，damp_x [Nx]，damp_z [Nz]，输出 p_out_prev/p_out_curr [B, Nz, Nx]"
  # 时间步进链（num_steps 最长 64）误差随步数累积，且波场值连续过零（误差全场
  # 均布、场值随机过零，同 batched_svd / dqmc_hubbard_greens 一类）。阈值用仓库
  # checker (kernel_eval.utils.compare.compare_tensors, native=plain golden) 实测
  # 确定：独立 fp32 路径（conv2d 单次累加 stencil，与 roll 逐项累加求和顺序不同）
  # vs fp64 oracle，覆盖 14 组 case 配置（1024²×64 步、CFL=0.4 顶界、v 常数、
  # damp 0/上界、素数维、p 值域 ±10 等）× 3~6 draw：正常值域 MERE ≤ 3.2e-5、
  # 正常值域（|golden| ≥ 相消边界 0.0039）MARE ≤ 4e-2（尖峰位于场值过零点附近，
  # 绝对误差 ~ 幅值×2e-5 除以固定相消边界所致；|golden| 更小处由评测框架小值域/
  # 相消兜底标准处理）。取 float32 0.02：MERE 裕量 ≥ 600x，MARE 阈值 0.2 对实测
  # 正常值域尖峰留 ≥ 5x 裕量。判别力实测：2 阶 stencil 错误实现 MERE=2.9、漏乘
  # 海绵因子 MERE=20，与阈值相隔 2 个数量级以上。case 空间约束：p 取值上限 ±10
  # （±100 时过零点相对误差尖峰实测达 0.25、随 draw 波动 4x，该角点不在 case 空
  # 间内，同 dqmc 先例的角点裁剪）。
  precision_thresholds:
    float32: 0.02
  attrs:
  - name: num_steps
    type: int
    description: 时间步数（评测取值 1 ~ 64）
    required: true
  - name: dt
    type: float
    description: 时间步长，单位 s（评测取值范围 [2e-4, 8e-4]；case 保证 CFL 约束 v_max*dt/dx ≤ 0.4）
    required: true
  - name: dx
    type: float
    description: 空间网格间距，单位 m，z/x 两方向同间距（评测取值范围 [5, 20]）
    required: true
  inputs:
  - name: p_prev
    description: 时间片 t-1 的波场；最外 4 圈由算子置 0（任意随机输入合法）
    dtype:
    - float32
    shape: "[B, Nz, Nx]"
  - name: p_curr
    description: 时间片 t 的波场；最外 4 圈由算子置 0（任意随机输入合法）
    dtype:
    - float32
    shape: "[B, Nz, Nx]"
  - name: velocity
    description: 介质声速场，单位 m/s（评测取值范围 [1500, 4500]，物理量程；配合 dt/dx 满足 CFL 约束）
    dtype:
    - float32
    shape: "[B, Nz, Nx]"
  - name: damp_x
    description: 海绵层 x 方向衰减剖面（评测取值范围 [0, 0.05]，任意随机剖面合法）
    dtype:
    - float32
    shape: "[Nx]"
  - name: damp_z
    description: 海绵层 z 方向衰减剖面（评测取值范围 [0, 0.05]，任意随机剖面合法）
    dtype:
    - float32
    shape: "[Nz]"
  outputs:
  - name: p_out_prev
    description: 最终时间片 t+num_steps-1 的波场（最外 4 圈为 0）
    dtype:
    - float32
    shape: "[B, Nz, Nx]"
  - name: p_out_curr
    description: 最终时间片 t+num_steps 的波场（最外 4 圈为 0）
    dtype:
    - float32
    shape: "[B, Nz, Nx]"
  schema: rtm_wave_stencil(Tensor p_prev, Tensor p_curr, Tensor velocity, Tensor damp_x, Tensor damp_z, int num_steps, float dt, float dx) -> (Tensor p_out_prev, Tensor p_out_curr)
