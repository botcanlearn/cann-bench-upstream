operator:
  name: CompressedWeightGemv
  category: FusedComposite
  difficulty: L5
  formula: |
    每个 4 块 j（K 位置 4j..4j+3）恰有 2 个非零（2:4 结构化稀疏）:
      (pos_a, pos_b) = SEL[sparse_sel[n,j]]     # 0→(0,1) 1→(0,2) 2→(0,3) 3→(1,2) 4→(1,3) 5→(2,3)
      W[n, 4j+pos_a] = ((packed_w[n,j] & 0xF) − 8)        · scales[n, (4j+pos_a)//group_size]
      W[n, 4j+pos_b] = (((packed_w[n,j] >> 4) & 0xF) − 8) · scales[n, (4j+pos_b)//group_size]
      其余位置 W = 0                             # int4 码 c ∈ [0,15] → 值 c−8 ∈ [−8,7]（码 0 → −8）
    y = x @ W^T + bias                           # [B, N]
  description: 自定义压缩位流（2:4 结构化稀疏 + int4 分组量化）的在线解码融合 GEMV，格式即规格，decode-bound
  shape_support: "x [B, K]，packed_w/sparse_sel [N, K/4] int32，scales [N, K/group_size]，bias [N]，输出 y [B, N]（dtype 与 x 一致）"
  # 解码是精确整数运算（nibble 提取 + 查表 + scale 乘法），无脆弱性；y 为 fp32 累加的
  # GEMV 数值路径，采用生态默认阈值，未放宽。仓库 checker
  # (kernel_eval.utils.compare.compare_tensors, native=plain golden) 实测 plain(fp32
  # 数据通路) vs fp64 oracle：bf16 MERE≈1.1e-6 / MARE≈8.0e-3（阈值 2^-7 通过），
  # fp16 MERE≈9.5e-7 / MARE≈1.1e-3（阈值 2^-10 通过），fp32 MERE≈1.7e-6 /
  # MARE≈1.1e-3（阈值 2^-13，MARE 尖峰位于相消/小值域，由评测框架兜底标准处理），
  # 含 bias 大值 / x 大值等陷阱值域在内全部配置 × 多种子通过。
  attrs:
  - name: group_size
    type: int
    description: 分组量化的组大小（4 的正倍数且整除 K），评测取值 {32, 64, 128}
    required: true
  inputs:
  - name: x
    description: 激活张量，K % 4 == 0 且 K % group_size == 0
    dtype:
    - bfloat16
    - float16
    - float32
    shape: "[B, K]"
  - name: packed_w
    description: 压缩权重码流，取值 [0, 255]（仅低 8 位有效）：低 nibble = 块内第一个非零的 int4 码，高 nibble = 第二个；码 c 解码为 c − 8 ∈ [−8, 7]
    dtype:
    - int32
    shape: "[N, K/4]"
  - name: sparse_sel
    description: 块内 4 选 2 非零位置组合编码，取值 [0, 5]：0→(0,1) 1→(0,2) 2→(0,3) 3→(1,2) 4→(1,3) 5→(2,3)
    dtype:
    - int32
    shape: "[N, K/4]"
  - name: scales
    description: 分组量化 scale，组索引 = 绝对列 // group_size；评测取值范围 [0.001, 0.1]
    dtype:
    - float16
    - float32
    shape: "[N, K/group_size]"
  - name: bias
    description: 输出偏置，dtype 与 x 一致
    dtype:
    - bfloat16
    - float16
    - float32
    shape: "[N]"
  outputs:
  - name: y
    description: y = x @ W^T + bias，dtype 与 x 一致
    dtype:
    - bfloat16
    - float16
    - float32
    shape: "[B, N]"
  schema: compressed_weight_gemv(Tensor x, Tensor packed_w, Tensor sparse_sel, Tensor scales, Tensor bias, int group_size) -> Tensor y
