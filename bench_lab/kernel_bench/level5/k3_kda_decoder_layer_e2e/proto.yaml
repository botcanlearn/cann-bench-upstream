operator:
  name: K3KdaDecoderLayerE2E
  category: FusedComposite
  difficulty: L5
  formula: |
    # ---- 注意力子层 ----
    x_mix = AttnResMix(x, R; attn 分支)；快照层 R_out = concat(R, x)，载体置空
    h  = RMSNorm(x_mix, γ_in, ε)
    [q|k|v] = SiLU(CausalConv1dUpdate(h·[Wq|Wk|Wv], conv_state))
    g  = ℓ·sigmoid(exp(A_log) ⊙ ((h·Wf1)·Wf2 + dt_bias))   # 衰减门低秩两级；ℓ=null 时 -exp(A_log)⊙softplus(·)
    β  = sigmoid(h·Wb)；q̂,k̂ = L2Norm(q,k)（eps=1e-6），q̂ ×= scale
    S ⊙= exp(g)；u = β⊙(v − Sᵀk̂)；S += k̂ uᵀ；o = Sᵀq̂
    o  = RMSNorm_head(o, γ_o, ε) ⊙ sigmoid(h·Wg)   # 输出门全秩无 bias
    x2 = x + o·Wo（快照层 x2 = o·Wo）
    # ---- LatentMoE 子层 ----
    m  = AttnResMix(x2, R_out; mlp 分支)；h2 = RMSNorm(m, γ_pa, ε)
    s  = sigmoid(h2·Wrᵀ)；idx = topk(s + bias_e, k)；w = s[idx]
    renormalize 时 w /= (Σw + 1e-20)；w ×= routed_scaling_factor
    z  = h2·W_lat_down
    e_out = SituAndMul(z·W_gu[e]) · W_dn[e]           # SituAndMul: β_s·tanh(g/β_s)·σ(g) × lβ·tanh(u/lβ)
    y_lat = Σ_k w·e_out；y_lat = RMSNorm(y_lat, γ_lat, ε)
    moe = y_lat·W_lat_up + SituAndMul(h2·W_sh_gu)·W_sh_dn
    y  = x2 + moe
  description: >
    Kimi K3 KDA 型 decoder 层「整层端到端」多卡融合 megakernel：注意力子层
    （AttnRes 混合 → RMSNorm → 投影/短卷积 → 细粒度门控 delta-rule 递归（fp32 状态）→
    输出门归一化 → 输出投影 → 载体残差）与 LatentMoE 子层（AttnRes 混合（MLP 分支）→
    RMSNorm → sigmoid 路由 top-k（noaux 校正偏置选择、原始分数加权、renormalize）→
    latent 降维 → 专家 SituAndMul FFN → latent 加权求和 → RMSNorm → 升维 →
    共享专家 → 载体残差）在一个跨 die 协同的 kernel 内完成。die 间并行模式
    （张量/序列/专家并行的分片与集合通信）由实现方声明或自行优化，正确性只按
    全局输入输出语义判定。提交形态为单次 kernel 提交（host→device 一次下发、
    device→host 一次返回）：层内全部计算与 die 间通信由 device 侧在 kernel 内
    发起完成，不允许 host 编排的 kernel 序列/host 侧集合通信调用/多 stream 提交
    （见 desc §2 提交形态硬约束）。
  shape_support: >
    x [B, Tmax, H]，conv_state [B, Dc, W-1]（Dc = 2·Hq·Kd + HV·Vd），
    recurrent_state [B, HV, Kd, Vd] fp32；MoE 侧 router_w [E, H]、latent 维 L、
    专家中间维 I、共享专家中间维 Is=2I。全部为通用参数。公开 case 采用 K3 缩放
    配置（case 1~6：H=3584, Hq=HV=48, Kd=Vd=128, W=4, E=112, k=16, L=1024,
    I=768），主形状为 world_size=8、B=8、Tmax=8（q_len=8）。Kimi K3 满配
    （H=7168, Hq=HV=96, E=896, L=3584, I=3072, β_s=4.0, lβ=25.0, ℓ=-5.0）为
    设计目标点：该规格单份输入约 56 GiB（bf16，其中两份专家权重 55.1 GiB），
    fp64_cpu oracle 路径需数百 GiB 宿主内存，故不进入公开 case（见 desc §6）。
  # ------------------------------------------------------------------
  # 阈值标定（CPU 侧 golden，口径 err=|a-b|/max(|b|,1e-3)，MERE<=阈值、
  # MARE<=10x阈值，fp64_cpu oracle 为真值，输出转回用例 dtype 后比对）。
  # 全部 20 个公开 case × 2 seed 实测，无跳过项，0 fail。各 dtype 实测下限：
  #   bfloat16 MERE<=1.9e-6 / MARE<=7.81e-3（恰为一个 bf16 量化步 2^-7）
  #     -> 阈值 0.02，MARE 上限余量 26x
  #   float16  MERE<=1.6e-6 / MARE<=9.8e-4（约一个 fp16 量化步）
  #     -> 阈值 0.005，MARE 上限余量 51x
  #   float32  MERE<=1.3e-6 / MARE<=5.2e-4 -> 阈值 0.001，MARE 上限余量 19x
  # bf16 不取 0.01 档：真实 decode 递归状态跨数千步累积，公开 case 的短链
  # （<=64 token）下限对此偏乐观，取值与同族长递归链先例
  # gated_deltanet2_chunkwise（bf16 0.02）一致。
  # 路由 top-k 的并列打破遵循 torch.topk 顺序，随机输入下并列概率可忽略；
  # 专家枚举顺序不影响数学结果（已验证置换不变性，fp64 差异 < 1e-12）。
  # 分组路由参数硬约束（E 整除 num_expert_group、每组 >= 2、
  # 1<=topk_group<=num_expert_group、top_k <= topk_group*(E/num_expert_group)）
  # 由 golden 显式校验，违反抛 ValueError；回归测试见
  # tests/ut/test_k3_grouped_routing_constraints.py。
  # ------------------------------------------------------------------
  precision_thresholds:
    float32: 0.001
    float16: 0.005
    bfloat16: 0.02
  attrs:
  - name: world_size
    type: int
    default: 8
    description: 协同执行的 die 数（4/8/16）。只约束执行与分片；主用例 B=world_size、Tmax=8，使每 die 激活工作量与 32-die pod 基线恒等
    required: false
  - name: num_heads
    type: int
    default: 96
    description: q/k 头数 Hq
    required: true
  - name: num_v_heads
    type: int
    default: 96
    description: v 头数 HV（GVA，须整除）
    required: true
  - name: head_dim
    type: int
    default: 128
    description: q/k 头维 Kd
    required: false
  - name: head_v_dim
    type: int
    default: 128
    description: v 头维 Vd
    required: false
  - name: conv_size
    type: int
    default: 4
    description: 短卷积宽度 W
    required: false
  - name: gate_lower_bound
    type: float
    default: -5.0
    description: log 域衰减下界 ℓ；null 时走 softplus 分支
    required: false
  - name: allow_neg_eigval
    type: bool
    default: false
    description: 为 true 时 β = 2·sigmoid(·)
    required: false
  - name: append_snapshot
    type: bool
    default: false
    description: 快照层标志（layer_idx % attn_res_block_size == 0）
    required: false
  - name: rms_eps
    type: float
    default: 1.0e-05
    description: 所有 RMSNorm 与 AttnRes 归一化的 ε
    required: false
  - name: scale
    type: float
    default: null
    description: 递归读出缩放，null 取 1/sqrt(head_dim)
    required: false
  - name: num_experts
    type: int
    default: 896
    description: 路由专家总数 E（不随 die 数缩减；EP 分片由实现决定）。须被 num_expert_group 整除且 E/num_expert_group >= 2
    required: true
  - name: top_k
    type: int
    default: 16
    description: 每 token 激活专家数；1 <= top_k <= topk_group·(E/num_expert_group)（golden 校验，违反抛 ValueError）
    required: true
  - name: num_expert_group
    type: int
    default: 1
    description: 分组路由的组数（K3 为 1，即无分组限制；>topk_group 时启用组内 top2 求和选组）。须整除 E 且每组至少 2 个专家
    required: false
  - name: topk_group
    type: int
    default: 1
    description: 分组路由选中的组数；1 <= topk_group <= num_expert_group
    required: false
  - name: moe_renormalize
    type: bool
    default: true
    description: top-k 权重是否归一化（除以 Σw + 1e-20）
    required: false
  - name: routed_scaling_factor
    type: float
    default: 1.0
    description: 路由权重缩放
    required: false
  - name: situ_beta
    type: float
    default: 4.0
    description: SituAndMul 的 gate 侧 β
    required: false
  - name: situ_linear_beta
    type: float
    default: 25.0
    description: SituAndMul 的 up 侧线性 β（null 时 up 不变换）
    required: false
  inputs:
  - name: x
    description: 载体隐状态（prefix_sum），varlen 右 padding
    dtype: [float32, float16, bfloat16]
    shape: "[B, Tmax, H]"
  - name: seq_lens
    description: 有效 token 数，1..Tmax（主用例 q_len=8）
    dtype: [int32]
    shape: "[B]"
  - name: block_residual
    description: AttnRes 快照
    dtype: [float32, float16, bfloat16]
    shape: "[B, Tmax, NB, H]"
  - name: conv_state
    description: 短卷积历史（原位更新语义）
    dtype: [float32, float16, bfloat16]
    shape: "[B, Dc, W-1]"
  - name: recurrent_state
    description: 递归状态（fp32 保存与累加；物理排布可由实现声明）
    dtype: [float32]
    shape: "[B, HV, Kd, Vd]"
  - name: w_q
    description: q 投影（FRACTAL_NZ 交付）
    dtype: [float32, float16, bfloat16]
    shape: "[H, Hq*Kd]"
  - name: w_k
    description: k 投影（NZ）
    dtype: [float32, float16, bfloat16]
    shape: "[H, Hq*Kd]"
  - name: w_v
    description: v 投影（NZ）
    dtype: [float32, float16, bfloat16]
    shape: "[H, HV*Vd]"
  - name: w_conv
    description: 逐通道卷积核，通道序 q|k|v，无 bias
    dtype: [float32, float16, bfloat16]
    shape: "[Dc, W]"
  - name: w_f1
    description: 衰减门低秩第一级 f_a（无 bias；ND，跟随现网）
    dtype: [float32, float16, bfloat16]
    shape: "[H, Kd]"
  - name: w_f2
    description: 衰减门低秩第二级 f_b（无 bias；NZ）
    dtype: [float32, float16, bfloat16]
    shape: "[Kd, HV*Kd]"
  - name: w_b
    description: beta 投影（NZ）
    dtype: [float32, float16, bfloat16]
    shape: "[H, HV]"
  - name: w_g
    description: 输出门全秩投影（use_full_rank_gate=True，无 bias；NZ）
    dtype: [float32, float16, bfloat16]
    shape: "[H, HV*Vd]"
  - name: A_log
    description: 逐 v-head 衰减参数
    dtype: [float32]
    shape: "[HV]"
  - name: dt_bias
    description: 衰减门逐通道 bias
    dtype: [float32]
    shape: "[HV*Kd]"
  - name: rms_in_w
    description: 输入 RMSNorm 权重
    dtype: [float32, float16, bfloat16]
    shape: "[H]"
  - name: o_norm_w
    description: 逐头输出 RMSNorm 权重
    dtype: [float32, float16, bfloat16]
    shape: "[Vd]"
  - name: w_o
    description: 输出投影（NZ）
    dtype: [float32, float16, bfloat16]
    shape: "[HV*Vd, H]"
  - name: attnres_attn_norm_w
    description: AttnRes 注意力分支归一化权重
    dtype: [float32, float16, bfloat16]
    shape: "[H]"
  - name: attnres_attn_proj_w
    description: AttnRes 注意力分支打分权重
    dtype: [float32, float16, bfloat16]
    shape: "[H]"
  - name: attnres_mlp_norm_w
    description: AttnRes MLP 分支归一化权重
    dtype: [float32, float16, bfloat16]
    shape: "[H]"
  - name: attnres_mlp_proj_w
    description: AttnRes MLP 分支打分权重
    dtype: [float32, float16, bfloat16]
    shape: "[H]"
  - name: post_attn_norm_w
    description: post-attention RMSNorm 权重
    dtype: [float32, float16, bfloat16]
    shape: "[H]"
  - name: router_w
    description: 路由打分权重（打分在 fp32 计算）
    dtype: [float32, float16, bfloat16]
    shape: "[E, H]"
  - name: router_bias
    description: noaux_tc 选择校正偏置 e_score_correction_bias（仅参与选择，不参与加权）
    dtype: [float32]
    shape: "[E]"
  - name: w_latent_down
    description: latent 降维投影（NZ；现网 bf16，不量化）
    dtype: [float32, float16, bfloat16]
    shape: "[H, L]"
  - name: w_latent_up
    description: latent 升维投影（NZ；现网 bf16）
    dtype: [float32, float16, bfloat16]
    shape: "[L, H]"
  - name: latent_norm_w
    description: latent RMSNorm 权重（latent_moe_use_norm=true）
    dtype: [float32, float16, bfloat16]
    shape: "[L]"
  - name: w_expert_gate_up
    description: 路由专家 gate|up 拼接权重（前 I 列 gate；现网以 MXFP4 存放，任务按逻辑浮点交付，见 desc 约束 7）
    dtype: [float32, float16, bfloat16]
    shape: "[E, L, 2*I]"
  - name: w_expert_down
    description: 路由专家 down 权重（现网 MXFP4，同上）
    dtype: [float32, float16, bfloat16]
    shape: "[E, I, L]"
  - name: w_shared_gate_up
    description: 共享专家 gate|up 拼接权重（现网 bf16，不量化；Is=2I）
    dtype: [float32, float16, bfloat16]
    shape: "[H, 2*Is]"
  - name: w_shared_down
    description: 共享专家 down 权重
    dtype: [float32, float16, bfloat16]
    shape: "[Is, H]"
  outputs:
  - name: y
    description: 两个子层与两次载体残差后的隐状态，padding 位置为 0
    dtype: [float32, float16, bfloat16]
    shape: "[B, Tmax, H]"
  - name: conv_state_out
    description: 更新后的卷积历史
    dtype: [float32, float16, bfloat16]
    shape: "[B, Dc, W-1]"
  - name: recurrent_state_out
    description: 更新后的递归状态（fp32）
    dtype: [float32]
    shape: "[B, HV, Kd, Vd]"
  - name: block_residual_out
    description: 快照层追加未混合的 x，否则逐位透传
    dtype: [float32, float16, bfloat16]
    shape: "[B, Tmax, NB(+1), H]"
  schema: >
    k3_kda_decoder_layer_e2e(Tensor x, Tensor seq_lens, Tensor block_residual,
    Tensor conv_state, Tensor recurrent_state, Tensor w_q, Tensor w_k, Tensor w_v,
    Tensor w_conv, Tensor w_f1, Tensor w_f2, Tensor w_b, Tensor w_g,
    Tensor A_log, Tensor dt_bias, Tensor rms_in_w, Tensor o_norm_w, Tensor w_o,
    Tensor attnres_attn_norm_w, Tensor attnres_attn_proj_w,
    Tensor attnres_mlp_norm_w, Tensor attnres_mlp_proj_w, Tensor post_attn_norm_w,
    Tensor router_w, Tensor router_bias, Tensor w_latent_down, Tensor w_latent_up,
    Tensor latent_norm_w, Tensor w_expert_gate_up, Tensor w_expert_down,
    Tensor w_shared_gate_up, Tensor w_shared_down, int world_size=8,
    int num_heads=96, int num_v_heads=96, int head_dim=128, int head_v_dim=128,
    int conv_size=4, float? gate_lower_bound=-5.0, bool allow_neg_eigval=False,
    bool append_snapshot=False, float rms_eps=1e-5, float? scale=None,
    int num_experts=896, int top_k=16, int num_expert_group=1, int topk_group=1,
    bool moe_renormalize=True, float routed_scaling_factor=1.0,
    float situ_beta=4.0, float? situ_linear_beta=25.0)
    -> (Tensor y, Tensor conv_state_out, Tensor recurrent_state_out, Tensor block_residual_out)
