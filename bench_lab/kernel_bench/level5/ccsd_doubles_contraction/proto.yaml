operator:
  name: CcsdDoublesContraction
  category: FusedComposite
  difficulty: L5
  formula: |
    投影（第一步，全部幂等）: A = P_as(t2)，W = P_as(eri_vvvv)，X = P_sym(eri_ovov)，
      Fv = (fock_vv + fock_vvᵀ)/2，Fo = (fock_oo + fock_ooᵀ)/2
      P_as(T)[p,q,r,s] = (T[p,q,r,s] − T[q,p,r,s] − T[p,q,s,r] + T[q,p,s,r])/4（前二/后二下标各自反对称化）
      P_sym(X)[i,a,j,b] = (X[i,a,j,b] + X[j,b,i,a])/2
    缩并（P(ij) f = f(i,j) − f(j,i)，P(ab) 同）:
      r2[i,j,a,b] = Σ_{cd} W[a,b,c,d] A[i,j,c,d]              # ladder，O(o²v⁴)
                  + P(ij)P(ab) Σ_{kc} X[k,c,j,b] A[i,k,a,c]   # ring，O(o³v³)，展开 4 项
                  + P(ab) Σ_c Fv[b,c] A[i,j,a,c]              # 粒子 Fock，展开 2 项
                  − P(ij) Σ_k Fo[j,k] A[i,k,a,b]              # 空穴 Fock，展开 2 项
    投影语义下 r2[i,j,a,b] = −r2[j,i,a,b] = −r2[i,j,b,a]（对任意随机输入数学成立）
  description: 耦合簇 CCSD/CCD T2 残差的主缩并项（自旋轨道反对称化形式）：粒子-粒子 ladder + ring + 单粒子 Fock 项，量子化学 Gordon Bell 级负载的算力主体；fp32 精度契约按 sub-kcal/mol 关联能敏感度锚定
  shape_support: "t2 [o,o,v,v]（r2 同 shape），eri_vvvv [v,v,v,v]，eri_ovov [o,v,o,v]，fock_vv [v,v]，fock_oo [o,o]；o = 占据轨道数，v = 虚轨道数"
  # 阈值按化学精度锚定并用仓库 checker (kernel_eval.utils.compare.compare_tensors,
  # native=plain golden) 实测确定。
  # 化学锚: r2 是残差张量而非能量，化学口径经敏感度传播转译——关联能
  # E_corr = 1/4 Σ ⟨ij||ab⟩ t2[ijab]，CC 迭代收敛到 r2=0 的不动点，r2 的相对误差 δ
  # 传播为收敛振幅与 E_corr 的同量级相对误差 |ΔE| ≈ δ·|E_corr|；典型 |E_corr| ~
  # 0.2~2 Ha（cc-pVDZ 档小分子），sub-kcal/mol（1 kcal/mol = 1.5936e-3 Ha）要求
  # δ ≤ 8e-4。取 float32 5e-4：|ΔE| ≤ 5e-4 × 2 Ha = 0.63 kcal/mol。
  # 值域定标: 非退化 case 的 t2（或陷阱本体所在的 eri）值域逐 case 定标，使 r2 元素
  # std ≈ 0.3（物理残差量级；t2 振幅随基组增大变小的真实趋势）。该定标同时把相消带
  # （|golden| ∈ [2^-14, 2^-8]，反对称结构零元邻域）的 fp32 误差尾部压入 MARE 判据
  # （10×阈值 = 5e-3）安全区——机理: plain golden 与 oracle 共享 einsum 求和顺序，
  # 在相消元上相关而异常准确，评测框架相消兜底的 native 计数偏低，求和顺序不同的
  # 真实 kernel 在中间阈值档（实测 1e-4/2e-4/4e-4 的 16-seed 均有 Poisson 误杀）
  # 会被零容忍分支误拒；5e-4 + std=0.3 定标后 16-seed 全配置稳定通过。
  # 实测（独立 fp32 实现: 两步投影 + flip/matmul 重组求和顺序，vs fp64 oracle）:
  # fp32 MERE ≤ 1.1e-6（阈值裕量 ≥450x），全配置多 seed 通过；bf16/fp16 为数据通路
  # 变体（不承诺化学精度，checker 对低精度输出以截断 golden 为基准），沿用先例阈值
  # float16 0.005 / bfloat16 0.02。判别力实测（5e-4）: 漏 t2 投影 MERE=7.5、W 投影
  # 漏 /4 MERE=7.9、ring 漏 P 展开 MERE=2.3、空穴 Fock 符号错 MERE=1.3，与阈值相隔
  # 3 个数量级以上。
  precision_thresholds:
    float32: 5.0e-04
    float16: 0.005
    bfloat16: 0.02
  inputs:
  - name: t2
    description: 双激发振幅，算子先做 (ij)/(ab) 反对称化投影（幂等；物理振幅是其不动点）；评测值域逐 case 定标使 r2 元素 std ≈ 0.3
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[o, o, v, v]"
  - name: eri_vvvv
    description: 虚-虚双电子积分 ⟨ab||cd⟩，算子先做 (ab)/(cd) 反对称化投影（幂等）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[v, v, v, v]"
  - name: eri_ovov
    description: 占据-虚双电子积分，算子先做 (ia)↔(jb) 对称化投影（幂等）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[o, v, o, v]"
  - name: fock_vv
    description: 虚-虚 Fock 块，算子先对称化 (F+Fᵀ)/2（幂等）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[v, v]"
  - name: fock_oo
    description: 占据-占据 Fock 块，算子先对称化 (F+Fᵀ)/2（幂等）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[o, o]"
  outputs:
  - name: r2
    description: T2 残差主缩并项，dtype 与 t2 一致，满足 r2[i,j,a,b] = −r2[j,i,a,b] = −r2[i,j,b,a]
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[o, o, v, v]"
  schema: ccsd_doubles_contraction(Tensor t2, Tensor eri_vvvv, Tensor eri_ovov, Tensor fock_vv, Tensor fock_oo) -> Tensor r2
