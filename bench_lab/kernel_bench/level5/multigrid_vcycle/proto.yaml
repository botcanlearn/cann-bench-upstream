operator:
  name: MultigridVcycle
  category: NumericalStable
  difficulty: L5
  formula: |
    3D Poisson −Δu = f（零 Dirichlet 边界，N = 2^k + 1 含边界点）的一次几何多重网格 V-cycle:
      算子:   (A u)[i,j,k] = (6*u[i,j,k] − Σ 六邻居) / h²
      平滑:   红黑 Gauss–Seidel（红 = 全局 0-based 索引 i+j+k 偶，先红后黑；
              更新式 u[i,j,k] = (h²*f[i,j,k] + Σ 六邻居)/6；同色内并行顺序无关，红黑先后即规格）
      残差:   r = f − A u（边界 0）
      限制:   full-weighting 27 点核 (1/64)*[1,2,1]⊗[1,2,1]⊗[1,2,1]，粗点 (I,J,K) ↔ 细点 (2I,2J,2K)，h ← 2h
      延拓:   三线性插值（8 种奇偶权重情形）
      递归:   pre_smooth 平滑 → 残差 → 限制 → 递归求误差方程（初值 0；最粗层以 20 次红黑平滑代替直接解）
              → u ← u + P(e) → post_smooth 平滑
    num_levels = 粗化次数（网格层数 = num_levels + 1），case 保证最粗层 ≥ 5³
  description: 3D Poisson 方程零 Dirichlet 边界的一次几何多重网格 V-cycle——红黑 Gauss–Seidel 平滑 + full-weighting 限制 + 三线性延拓的多分辨率递归
  shape_support: "u0/f [B, N, N, N]（N = 2^k + 1），输出 u_out [B, N, N, N]"
  # V-cycle 链 = (pre+post)×(num_levels+1) 次红黑平滑 + 最粗层 20 次平滑 + 层间
  # 转移，误差沿红黑两遍扫与层间递归累积。阈值用仓库 checker
  # (kernel_eval.utils.compare.compare_tensors, native=plain golden) 实测确定：
  # 独立 fp32 路径（conv3d 邻居和/限制核，与切片逐项累加求和顺序不同）vs fp64
  # oracle，覆盖 12 组 case 配置（N=33/65/129、levels 2~5、平滑 1~4、h 0.01/1.0、
  # f 全 0、u0 全 0、值域 ±100）× 3~6 draw：MERE ≤ 5.7e-6，MARE 尖峰 ≤ 1.8e-2
  # （位于解过零点/相消处，由评测框架小值域/相消兜底标准处理）。取 float32
  # 0.002：MERE 裕量 ≥ 350x，MARE 阈值 0.02 覆盖实测尖峰。判别力实测：黑先红后
  # MERE=3.8、Jacobi 平滑 MERE=15、injection 限制 MERE=83，与阈值相隔 3 个数量
  # 级以上。
  precision_thresholds:
    float32: 0.002
  attrs:
  - name: num_levels
    type: int
    description: 粗化（限制）次数，网格层数 = num_levels + 1（评测取值 2 ~ 5；case 保证最粗层网格 ≥ 5³，即 (N-1)/2^num_levels ≥ 4）
    required: true
  - name: pre_smooth
    type: int
    description: 每层延拓前的红黑 Gauss–Seidel sweep 数（评测取值 1 ~ 4）
    required: true
  - name: post_smooth
    type: int
    description: 每层延拓修正后的红黑 Gauss–Seidel sweep 数（评测取值 1 ~ 4）
    required: true
  - name: h
    type: float
    description: 最细层网格间距（评测取值范围 [0.01, 1.0]；粗一层 h 翻倍）
    required: true
  inputs:
  - name: u0
    description: 初始猜测；最外层由算子置 0（任意随机输入合法）
    dtype:
    - float32
    shape: "[B, N, N, N]"
  - name: f
    description: 右端项 −Δu = f；边界值不参与计算（评测取值范围 [-1, 1]）
    dtype:
    - float32
    shape: "[B, N, N, N]"
  outputs:
  - name: u_out
    description: 一次 V-cycle 后的解（最外层为 0）
    dtype:
    - float32
    shape: "[B, N, N, N]"
  schema: multigrid_vcycle(Tensor u0, Tensor f, int num_levels, int pre_smooth, int post_smooth, float h) -> Tensor u_out
