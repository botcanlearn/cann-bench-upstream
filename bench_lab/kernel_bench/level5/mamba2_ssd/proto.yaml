operator:
  name: Mamba2Ssd
  category: FusedComposite
  difficulty: L5
  formula: |
    a_t = exp(dt_t · A)                              # 逐头标量衰减，A < 0 保证 a_t ∈ (0, 1)
    h_t = a_t · h_{t-1} + dt_t · (B_t ⊗ x_t)         # 状态递归，h ∈ [B, H, P, N]，h_0 = 0
    y_t = h_t · C_t + D_skip ⊙ x_t                   # 状态读出 + 残差跳连
    （B_t / C_t 按 KV 组广播到 H 个头，H % G == 0）
  description: Mamba2 分块状态空间对偶（SSD）算子，选择性状态空间递归 + 组共享 B/C + 残差跳连
  shape_support: "x [B, L, H, P]，dt [B, L, H]，A [H]，B_mat/C_mat [B, L, G, N]，D_skip [H]，输出 y [B, L, H, P]"
  # 长时间递归链（L 最长 8192）+ SSD 分块重排（块内 matmul 化 + 块间状态递归）与朴素
  # 递归的求和顺序不同，误差随序列累积；相对生态标准适度放宽（bfloat16 0.02，MARE 阈值
  # = 0.2；float32 0.001，MARE 阈值 = 0.01）。状态 h 要求以 fp32 精度保存/累加。
  precision_thresholds:
    float32: 0.001
    bfloat16: 0.02
  attrs:
  - name: chunk_size
    type: int
    default: 256
    description: SSD 分块大小，仅约束 kernel 的分块实现（块内 matmul 化 + 块间状态递归），不影响数学结果
    required: false
  inputs:
  - name: x
    description: 输入序列，H 个头、每头 headdim P
    dtype:
    - float32
    - bfloat16
    shape: "[B, L, H, P]"
  - name: dt
    description: 逐 token 逐头时间步长 Δt，要求恒正（评测取值范围 [0.001, 0.1]）
    dtype:
    - float32
    - bfloat16
    shape: "[B, L, H]"
  - name: A
    description: 逐头状态转移标量（对数衰减率），要求恒负（评测取值范围 [-8, -0.5]），保证 exp(dt·A) ∈ (0, 1)
    dtype:
    - float32
    - bfloat16
    shape: "[H]"
  - name: B_mat
    description: 输入投影系数（SSM 的 B），G 个 KV 组、组内 H/G 个头共享
    dtype:
    - float32
    - bfloat16
    shape: "[B, L, G, N]"
  - name: C_mat
    description: 状态读出系数（SSM 的 C），G 个 KV 组、组内 H/G 个头共享
    dtype:
    - float32
    - bfloat16
    shape: "[B, L, G, N]"
  - name: D_skip
    description: 逐头残差跳连系数 D
    dtype:
    - float32
    - bfloat16
    shape: "[H]"
  outputs:
  - name: y
    description: 输出序列，shape 与 x 一致
    dtype:
    - float32
    - bfloat16
    shape: "[B, L, H, P]"
  schema: mamba2_ssd(Tensor x, Tensor dt, Tensor A, Tensor B_mat, Tensor C_mat, Tensor D_skip, int chunk_size=256) -> Tensor y
