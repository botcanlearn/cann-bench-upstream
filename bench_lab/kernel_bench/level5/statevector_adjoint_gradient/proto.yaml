operator:
  name: StatevectorAdjointGradient
  category: FusedComposite
  difficulty: L5
  formula: |
    psi <- state / (||state|| + 1e-12)                        # 归一化，复数以 [...,2] 实虚分离
    译码: gate = c0 mod 5, qa = c1 mod n, qb = c2 mod n, tid = c3 mod T（每行 [c0,c1,c2,c3]）
    门集: 0 H(qa)  1 RZ(theta_tid)(qa)  2 RX(theta_tid)(qa)  3 CNOT(qa->qb)  4 CZ(qa,qb)
          （qa == qb 的两比特门为恒等门）
    前向: |psi> = U_{G-1} ... U_0 |psi_0>；|phi> = O|psi>，O = ⊗_q P_q（pauli_obs: 0 I/1 X/2 Y/3 Z）
    expval = Re<phi|psi>
    伴随法逆序 g = G-1..0:  psi <- U_g^† psi；
        若 U_g 含参: grads[tid_g] += 2·Re<phi|(dU_g/dtheta)|psi>；  phi <- U_g^† phi
  description: 量子态矢电路模拟 + 伴随法梯度（adjoint differentiation），程序即数据的门序列前向与逆序回放，复数手工实虚分离
  shape_support: "state [2^n, 2] float32（n 由 shape 推出），circuit [G, 4] int32，thetas [T] float32，pauli_obs [n] int32；输出 expval [1] float32、grads [T] float32"
  # 阈值用仓库 checker (kernel_eval.utils.compare.compare_tensors, native=plain golden)
  # 实测确定：plain(fp32) vs fp64 oracle，全部 100 case 双跑校准（含最大规模 n=22/
  # G=256/T=64、深参数链 G=256 全 RZ/RX、全门共享单参数 T=1、恒等电路与全 I/Z/X/Y
  # 观测量陷阱），checker 全量判 passed。实测 MERE ≤ 1.26e-5、MARE ≤ 3.94e-4。
  # 取 float32 0.0001（MERE 留 ≥7x、MARE 判据 (10x=1e-3) 留 ≥2.5x 裕量；小值域/
  # 相消尖峰由兜底标准处理，native 与 candidate 同为 fp32 路径，兜底比较公平）。
  # 复数模拟对精度敏感（G 级酉链误差积累），不支持 fp16/bf16（见 desc §4）。
  precision_thresholds:
    float32: 0.0001
  inputs:
  - name: state
    description: 输入量子态，实部/虚部分离（算子内部归一化，任意随机态合法），行数必须为 2 的幂（= 2^n）
    dtype:
    - float32
    shape: "[2^n, 2]"
  - name: circuit
    description: 电路指令序列，每行 [c0,c1,c2,c3] 经 mod 译码为 (gate, qa, qb, tid)，任意非负整数合法（评测取值范围 [0, 1073741823]）
    dtype:
    - int32
    shape: "[G, 4]"
  - name: thetas
    description: 旋转门参数（评测取值范围 [-3.14159, 3.14159]），多条指令可共享同一 tid（梯度累加）
    dtype:
    - float32
    shape: "[T]"
  - name: pauli_obs
    description: 张量积可观测量 O = ⊗_q P_q 的逐 qubit 编码（0 I、1 X、2 Y、3 Z，评测取值范围 [0, 3]），长度必须等于 n
    dtype:
    - int32
    shape: "[n]"
  outputs:
  - name: expval
    description: 期望值 <psi_G|O|psi_G>（实数）
    dtype:
    - float32
    shape: "[1]"
  - name: grads
    description: 伴随法梯度 d expval / d thetas，无参数贡献的分量为 0
    dtype:
    - float32
    shape: "[T]"
  schema: statevector_adjoint_gradient(Tensor state, Tensor circuit, Tensor thetas, Tensor pauli_obs) -> (Tensor expval, Tensor grads)
