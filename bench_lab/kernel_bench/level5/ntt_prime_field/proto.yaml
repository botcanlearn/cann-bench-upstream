operator:
  name: NttPrimeField
  category: FusedComposite
  difficulty: L5
  formula: |
    ω = g^((p-1)/N) mod p                        # g 为素数 p 的原根（算子内置原根表）
    前向:   y_j = Σ_{i=0}^{N-1} x_i · ω^{ij}      mod p
    逆变换: y_j = N^{-1} · Σ_{i=0}^{N-1} x_i · ω^{-ij}  mod p   （N^{-1} 为 N 的模逆）
    输入输出均为自然顺序
  description: 素域 Z_p 上的批量数论变换（NTT），整数模运算精确定义，输出零容差
  shape_support: "x [B, N] int32（取值 [0, p-1]，N 为 2 的幂且 N | (p-1)），输出 y [B, N] int32（取值 [0, p-1]）"
  # 整数域精确运算，结果唯一确定：int32 阈值 0（完全相等，一 bit 错即失败）。
  # 该条目与框架 int32 默认阈值一致，显式写出以明确零容差契约。
  precision_thresholds:
    int32: 0
  attrs:
  - name: modulus
    type: int
    default: 2013265921
    description: NTT 友好素数 p，支持 2013265921（BabyBear，默认）/ 998244353 / 167772161 / 469762049 / 754974721，均 < 2^31 且 p-1 含大 2-幂因子
    required: false
  - name: inverse
    type: bool
    default: "false"
    description: 是否执行逆变换（结果乘 N^{-1} mod p），false 为前向变换
    required: false
  inputs:
  - name: x
    description: 批量输入序列，取值 [0, modulus-1]；N 为 2 的幂且 N | (modulus-1)
    dtype:
    - int32
    shape: "[B, N]"
  outputs:
  - name: y
    description: 变换结果，取值 [0, modulus-1]，自然顺序（零容差精确比对）
    dtype:
    - int32
    shape: "[B, N]"
  schema: ntt_prime_field(Tensor x, int modulus=2013265921, bool inverse=False) -> Tensor y
