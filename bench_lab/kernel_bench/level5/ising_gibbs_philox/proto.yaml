operator:
  name: IsingGibbsPhilox
  category: FusedComposite
  difficulty: L5
  formula: |
    周期边界 2D 晶格棋盘 Gibbs 更新。一个 sweep = 先全部黑格（i+j 偶）再全部白格（i+j 奇），
    同色格子相互独立（更新顺序无关），白格看到更新后的黑格。对格点 (b,i,j)、sweep s、颜色相 c:
      nsum = Σ 四邻居 σ（σ = 2·spin − 1，周期边界），k = (nsum + 4) / 2 ∈ {0..4}
      r = Philox4x32-10(key=(seed_hi, seed_lo), counter=(s, c, b, i·W+j)).x0
      若 r < accept_table[spin, k] 则 spin ← 1 − spin
    重复 num_sweeps 次。Philox 轮常数 0xD2511F53 / 0xCD9E8D57，key 增量 0x9E3779B9 / 0xBB67AE85，10 轮
  description: 周期边界 2D 晶格的棋盘 Gibbs 更新，Philox4x32-10 计数器 RNG 按 (sweep, color, batch, site) 即时生成随机数——bit-exact 随机模拟，输出零容差
  shape_support: "spins [B, H, W] int8（取值 {0,1}，H、W 均为偶数），accept_table [2, 5] int64（取值 [0, 2^32-1]），输出 spins_out [B, H, W] int8"
  # 全整数确定性计算（Philox 计数器 RNG + 整数比较 + 翻转），结果唯一确定：
  # int8 阈值 0（完全相等，一 bit 错即失败）。该条目与框架 int8 默认阈值一致，
  # 显式写出以明确零容差契约。
  precision_thresholds:
    int8: 0
  attrs:
  - name: num_sweeps
    type: int
    description: sweep 次数（一个 sweep = 黑格相 + 白格相），评测取值 1 ~ 64
    required: true
  - name: seed_hi
    type: int
    description: Philox key 高 32 位字 k0，按无符号 32 位解释（评测取值 [0, 2^32-1]）
    required: true
  - name: seed_lo
    type: int
    description: Philox key 低 32 位字 k1，按无符号 32 位解释（评测取值 [0, 2^32-1]）
    required: true
  inputs:
  - name: spins
    description: 初始自旋场，0 代表自旋 −1、1 代表 +1；H、W 均为偶数（棋盘二染色在周期边界下成立的前提）
    dtype:
    - int8
    shape: "[B, H, W]"
  - name: accept_table
    description: 32 位无符号阈值表（int64 承载），行 = 当前 spin ∈ {0,1}，列 = 邻居和索引 k ∈ {0..4}；任意随机表均合法（定义一个确定性元胞自动机，物理 Boltzmann 表只是特例）
    dtype:
    - int64
    shape: "[2, 5]"
  outputs:
  - name: spins_out
    description: num_sweeps 个 sweep 后的自旋场，取值 {0,1}（零容差精确比对）
    dtype:
    - int8
    shape: "[B, H, W]"
  schema: ising_gibbs_philox(Tensor spins, Tensor accept_table, int num_sweeps, int seed_hi, int seed_lo) -> Tensor spins_out
