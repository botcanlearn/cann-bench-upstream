operator:
  name: MobaAttention
  category: FusedComposite
  difficulty: L5
  formula: |
    k̄_j = mean(key[块 j])                       # 块代表键，nb = ceil(S/block_size)，末块按实际长度取均值
    s_{t,j} = q_t · k̄_j  (j < cur，不乘 scaleValue)；s_{t,cur} = +inf；s_{t,j} = -inf (j > cur)
    B_t = top_k(s_{t,·})                         # cur = floor(t/block_size)；并列时取块索引更小者
    P_t = {p ∈ ∪_{j∈B_t} 块 j 且 p ≤ t}          # 当前块内因果，过去块全可见
    y_t = softmax_{p∈P_t}(scaleValue · q_t · k_p) v_p
    block_indices[t] = sorted(B_t) 升序，不足 top_k 用 -1 填充
  description: MoBA 块稀疏注意力算子，KV 按块均值门控做 top-k 块选择后计算块稀疏因果注意力，同时输出选中块索引
  shape_support: "query/key/value [B, S, N, D]（BSND，MHA），输出 y [B, S, N, D]、block_indices [B, S, N, top_k] int32"
  # y 为标准 softmax 注意力数值路径（fp32 累加），采用生态默认阈值，未放宽。仓库 checker
  # 实测（公开 case 1 规模，plain fp32 vs fp64 真值）：bf16 MERE 1.7e-6 / MARE 7.4e-2 < 10×2^-7，
  # fp16 与 fp32 亦通过默认阈值。block_indices 为 int32 结构输出，默认阈值 0（完全相等）：
  # 实测 bf16 输入下 fp32 与 fp64 门控在 52 万 query 行上选择零翻转，精确比对可行。
  attrs:
  - name: block_size
    type: int
    description: KV 块大小（正整数），S 无需整除，末块按实际长度处理
    required: true
  - name: top_k
    type: int
    description: 每个 query 选择的块数（≥ 1），当前块必选且计入名额；可选块不足时全选、索引输出补 -1
    required: true
  - name: scaleValue
    type: float
    description: 注意力缩放因子，通常为 1/sqrt(D)；仅作用于注意力分数，门控分数不乘
    required: true
  inputs:
  - name: query
    description: 查询张量（BSND，MHA，各头独立做块选择）
    dtype:
    - bfloat16
    - float16
    - float32
    shape: "[B, S, N, D]"
  - name: key
    description: 键张量，shape 与 query 一致；同时用于块代表键（块内均值）与注意力
    dtype:
    - bfloat16
    - float16
    - float32
    shape: "[B, S, N, D]"
  - name: value
    description: 值张量，shape 与 query 一致
    dtype:
    - bfloat16
    - float16
    - float32
    shape: "[B, S, N, D]"
  outputs:
  - name: y
    description: 块稀疏注意力输出，dtype/shape 与 query 一致
    dtype:
    - bfloat16
    - float16
    - float32
    shape: "[B, S, N, D]"
  - name: block_indices
    description: 每个 (b, t, n) 选中的块索引，升序排列，不足 top_k 用 -1 填充（结构输出，零容差精确比对）
    dtype:
    - int32
    shape: "[B, S, N, top_k]"
  schema: moba_attention(Tensor query, Tensor key, Tensor value, int block_size, int top_k, float scaleValue) -> (Tensor y, Tensor block_indices)
