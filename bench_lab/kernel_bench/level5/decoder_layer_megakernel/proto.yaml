operator:
  name: DecoderLayerMegakernel
  category: FusedComposite
  difficulty: L5
  formula: |
    h  = RMSNorm(x, γ1, ε)                                          # 沿 H，rms = sqrt(mean(x²)+ε)
    q  = RoPE(h @ wq)，k_new = RoPE(h @ wk)，v_new = h @ wv          # RoPE 半维旋转，cos/sin 已按位置索引
    k_cache_out[b, :, cache_len[b], :] = k_new[b]（v 同）             # 其余槽位逐位保持输入值
    attn = GQA-Attention(q, k_cache_out, v_cache_out, L_b = cache_len[b]+1) @ wo
    x2 = x + attn                                                    # 残差
    y  = x2 + (SiLU(h2 @ w_gate) ⊙ (h2 @ w_up)) @ w_down，h2 = RMSNorm(x2, γ2, ε)
  description: 单 token 解码整层融合 megakernel：pre-norm decoder 层（RMSNorm → QKV 投影 → RoPE → KV cache 追加 → 变长 GQA attention → 输出投影 → 残差 → RMSNorm → SwiGLU MLP → 残差）在一个 kernel 内完成
  shape_support: "x [B, 1, H]，k_cache/v_cache [B, Nkv, Smax, D]，cache_len [B] int32，输出 y [B, 1, H] 与更新后的两个 cache"
  # 阈值用仓库 checker (kernel_eval.utils.compare.compare_tensors, native=plain golden)
  # 实测确定：plain golden（fp32 数据通路）对 fp64 oracle 的误差下限，在公开 case 规模
  # （H=4096/F=14336/Smax=4096 与 H=2048/F=5504/Smax=2048）下为
  # bf16 y.MERE≈1e-6~3e-6 / y.MARE≈4.7e-3~7.6e-3，fp16 MERE≈9e-7~7e-6 / MARE≈2.5e-3~4.2e-3，
  # fp32 MERE≈3e-7~5e-6 / MARE≈2.5e-5~6.0e-4（MARE 尖峰位于两处残差与 softmax 加权和的
  # 相消位置，小值域由评测框架兜底标准处理）。fp16/fp32 的实测 MARE 下限距默认阈值的
  # MARE 上限（10×默认阈值）仅约 2 倍，换一种求和顺序的正确实现没有余量，故放宽为
  # bfloat16 0.01 / float16 0.005 / float32 0.001（MARE 上限为实测下限的 12~16 倍），
  # 与同类先例 flash_attention_backward（bf16 0.01 / fp32 0.001）、
  # gated_deltanet2_chunkwise（fp16 0.005 / fp32 0.001）一致。
  # k_cache_out / v_cache_out 除写入槽位外逐位等于输入（实测 MERE ≤ 2.3e-9），
  # 未写槽位被改动会被 MARE 上限直接判失败（已负测试验证）。
  precision_thresholds:
    float32: 0.001
    float16: 0.005
    bfloat16: 0.01
  attrs:
  - name: epsilon
    type: float
    default: 1e-6
    description: 两处 RMSNorm 的 epsilon（加在均方内）
    required: false
  inputs:
  - name: x
    description: 本步输入 hidden states（单 token 解码，S_q = 1）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, 1, H]"
  - name: gamma1
    description: attention 前 RMSNorm 的缩放参数 γ1
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H]"
  - name: wq
    description: query 投影权重，列按头拼接（头 n 占列 n*D..(n+1)*D-1）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H, Nq*D]"
  - name: wk
    description: key 投影权重，列按 KV 头拼接
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H, Nkv*D]"
  - name: wv
    description: value 投影权重，列按 KV 头拼接
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H, Nkv*D]"
  - name: wo
    description: attention 输出投影权重
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[Nq*D, H]"
  - name: gamma2
    description: MLP 前 RMSNorm 的缩放参数 γ2
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H]"
  - name: w_gate
    description: SwiGLU gate 投影权重
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H, F]"
  - name: w_up
    description: SwiGLU up 投影权重
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[H, F]"
  - name: w_down
    description: SwiGLU down 投影权重
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[F, H]"
  - name: k_cache
    description: key cache，样本 b 的有效位置为 0..cache_len[b]-1，本步写入槽位 cache_len[b]，其余槽位逐位保持输入值
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, Nkv, Smax, D]"
  - name: v_cache
    description: value cache（追加语义与 k_cache 相同）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, Nkv, Smax, D]"
  - name: cache_len
    description: 各样本已有的有效 cache 长度，∈ [1, Smax-1]（由评测 value_range 保证，写入槽位恒合法）
    dtype:
    - int32
    shape: "[B]"
  - name: rope_cos
    description: RoPE 余弦（已按各样本当前位置索引好，golden 直接使用）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, D]"
  - name: rope_sin
    description: RoPE 正弦（已按各样本当前位置索引好）
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, D]"
  outputs:
  - name: y
    description: 本层输出 hidden states，dtype 与 x 一致
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, 1, H]"
  - name: k_cache_out
    description: 追加后的 key cache，shape/dtype 与 k_cache 一致；除写入槽位外逐位等于输入
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, Nkv, Smax, D]"
  - name: v_cache_out
    description: 追加后的 value cache，shape/dtype 与 v_cache 一致；除写入槽位外逐位等于输入
    dtype:
    - float32
    - float16
    - bfloat16
    shape: "[B, Nkv, Smax, D]"
  schema: decoder_layer_megakernel(Tensor x, Tensor gamma1, Tensor wq, Tensor wk, Tensor wv, Tensor wo, Tensor gamma2, Tensor w_gate, Tensor w_up, Tensor w_down, Tensor k_cache, Tensor v_cache, Tensor cache_len, Tensor rope_cos, Tensor rope_sin, float epsilon=1e-6) -> (Tensor y, Tensor k_cache_out, Tensor v_cache_out)
