operator:
  name: BatchedSvd
  category: NumericalStable
  difficulty: L5
  formula: |
    A = U · diag(S) · V^T                     # 薄 SVD（economy），M ≥ N
    U [B, M, N] 列正交，S [B, N] 降序非负，V [B, N, N] 列正交
    规范化：对每列 u_j，取 |u_j| 最大分量所在位置 i*；若 u_j[i*] < 0，
    则 u_j 与对应 v_j 同时取反（消除符号不唯一性，保证可逐元素比对）
  description: 批量薄奇异值分解算子，迭代数值算法（预期单边 Jacobi 旋转），含符号规范化约定
  shape_support: "a [B, M, N]（M ≥ N，由 cases 保证），输出 u [B, M, N]、s [B, N]、v [B, N, N]"
  # 精度校验对象不是裸 u/v，而是 golden.get_output 给出的结构化校验量：
  #   [U·diag(S)·V^T（重构）, S, cat(U^T(U⊙sgn), V^T V) + 1（正交性 + 符号约定）]，
  # 对合法 SVD 的自由度不敏感、对结构性错误（缩放、非正交、错配、乱序、未规范化符号）敏感；
  # 输入经 golden.get_input 重建为 cond=10、谱间隔恒定的良条件矩阵。fp32 参考实现实测
  # MERE≈1e-6、MARE≤1e-3（重构中接近小值域边界的元素），取 5e-4（MARE 阈值 5e-3）：
  # 较默认 2^-13 留出约 4 倍余量以容纳迭代式 fp32 kernel，同时 4% 缩放 / 0.3% 非正交均被拒。
  precision_thresholds:
    float32: 0.0005
  attrs: []
  inputs:
  - name: a
    description: 待分解的批量矩阵，要求 M ≥ N（由 cases 保证）
    dtype:
    - float32
    shape: "[B, M, N]"
  outputs:
  - name: u
    description: 左奇异向量（列正交，经符号规范化）
    dtype:
    - float32
    shape: "[B, M, N]"
  - name: s
    description: 奇异值，降序非负
    dtype:
    - float32
    shape: "[B, N]"
  - name: v
    description: 右奇异向量（列向量形式，A = U diag(S) V^T，经符号规范化）
    dtype:
    - float32
    shape: "[B, N, N]"
  schema: batched_svd(Tensor a) -> (Tensor u, Tensor s, Tensor v)
