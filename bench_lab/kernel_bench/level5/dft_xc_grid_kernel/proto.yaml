operator:
  name: DftXcGridKernel
  category: FusedComposite
  difficulty: L5
  formula: |
    D = (dm + dmᵀ)/2；ρ_g = Σ_{μν} φ_gμ D_μν φ_gν；(∇ρ)_g = 2 Σ_{μν} (∂φ)_gμ D_μν φ_gν；σ_g = |∇ρ_g|²
    数值防护（规格）: ρ ← max(ρ, 1e-8)；σ ← max(σ, 1e-20)；t² ← min(t², 1e8)
    PBE 交换: e_x = −(3/4)(3/π)^{1/3} ρ^{4/3} · F_x，F_x = 1 + κ − κ/(1 + μs²/κ)，
      s² = σ/(4(3π²)^{2/3} ρ^{8/3})，κ=0.804，μ=0.2195149727645171
    PW92 关联: ε_c(r_s) = −2A(1+α₁r_s) ln[1 + 1/(2A(β₁√r_s + β₂r_s + β₃r_s^{3/2} + β₄r_s²))]，
      r_s = (3/(4πρ))^{1/3}；A=0.0310907, α₁=0.21370, β₁=7.5957, β₂=3.5876, β₃=1.6382, β₄=0.49294
    PBE 梯度修正: H = γ ln[1 + (β/γ)t²(1+At²)/(1+At²+A²t⁴)]，γ=(1−ln2)/π²，β=0.06672455060314922，
      t² = σ/(4k_s²ρ²)，k_s=√(4k_F/π)，k_F=(3π²ρ)^{1/3}，A = (β/γ)/[exp(−ε_c/γ)−1]
    e_xc = e_x + ρ(ε_c + H)；exc_energy = Σ_g w_g e_xc,g
    v_ρ = ∂e_xc/∂ρ，v_σ = ∂e_xc/∂σ（泛函精确偏导）；
    vxc[μ,ν] = Σ_g w_g [v_ρ φ_gμ φ_gν + 2v_σ(∇ρ·(∇φ)_gμ φ_gν + φ_gμ ∇ρ·(∇φ)_gν)]
    输出规范化（规格）: vxc_shifted = vxc + 10.0（常数平移，使用方减 10.0 还原物理 V_xc）
    契约: vxc_shifted 对称；∂exc_energy/∂dm_μν = vxc_shifted_μν − 10.0（变分一致性）
  description: DFT 数值积分（numint）热点：格点密度评估（GEMM）→ PBE 交换-相关泛函逐点求值（超越函数链）→ V_xc 矩阵组装（GEMM），单算子内 VEC/CUBE 数据依赖串联混载；能量精度契约锚定化学精度（sub-kcal/mol）
  shape_support: "ao_values [G, Nb]，ao_grad [3, G, Nb]，dm [Nb, Nb]，grid_weights [G]；输出 exc_energy [1]、vxc_shifted [Nb, Nb]"
  # 阈值按化学精度锚定并用仓库 checker (kernel_eval.utils.compare.compare_tensors,
  # native=plain golden) 实测确定。
  # 化学锚: 1 kcal/mol = 1.5936e-3 Ha。case 空间的 dm/grid_weights 值域逐 case 定标到
  # 真实分子量级——|Exc| 目标 min(0.32·Nb, 30) Ha（H2O/def2-SVP ~9 Ha、苯/def2-SVP
  # ~37 Ha 同数量级），w 上界取 min(1e-2, 16/G) 使 Σw ~ 常数（物理数值积分中权重随
  # 格点加密变小）；实测非陷阱档 |Exc| ≤ 52 Ha（含 draw 波动），threshold=3e-5 给出
  # 逐 case 能量绝对误差 ≤ 3e-5×52 Ha = 0.98 kcal/mol（典型 case ≤0.6 kcal/mol）。
  # 值域陷阱档（dm 全 0/常数/±10/±1e4、w 常数、ao_grad 全 0/±10 等）不在化学锚内，
  # 由同一相对判据（尺度无关）覆盖。
  # 可行性: vxc 物理元素过零密集，收紧阈值靠输出规范化 vxc+10（形如 batched_svd 的
  # 输出规范化先例；比较变为 |err|/(|vxc+10|) ≈ 绝对误差口径）；ρ 下限 1e-8 保证
  # fp32 除式反向不下溢出 inf（1e-10 下 s² 除式分母平方 ~1e-49 下溢，dm 常数 case
  # ~1/8 draw 出 inf，实测复现并以 16 seed 验证修复）。实测（独立 fp32 实现: pow 走
  # exp/log、ln(1+x)/exp(x)−1 走朴素式、归约 einsum+flip、偏导建在替代图上，vs fp64
  # oracle）: 23 组 case 配置全过，plain 全 100 case×2~8 seed 扫描 0 失败，
  # worst MERE=3.6e-07（裕量 83x）、worst MARE=3.6e-05（MARE 判据 3e-4，裕量 8.4x）。
  # 判别力实测（3e-5）: 漏 dm 对称化 MERE=9.4e-5/7.3e-4（定标档/陷阱档）、∇ρ 漏因子 2
  # 7.9e-5/6.7e-4、漏 H 修正 5.9e-5/3.1e-4、PW92 A 用自旋极化值 5.6e-5/7.7e-4、E_c 多乘
  # ρ 1.2e-3/1.2、漏输出平移 1.0/1.0、t² 误用 s² 拒、vxc 梯度项漏因子 2 在定标档 2.2e-5
  # 低于阈值但被值域陷阱档（case 17/32/41 等 dm±10）明确拒绝（MERE=9.2e-5,
  # MARE=1.8e-3）——判别力由全 case 空间共同承担。
  precision_thresholds:
    float32: 3.0e-05
  inputs:
  - name: ao_values
    description: Nb 个基函数在 G 个格点上的值 φ_gμ
    dtype:
    - float32
    shape: "[G, Nb]"
  - name: ao_grad
    description: 基函数梯度三分量 (∂φ/∂x, ∂φ/∂y, ∂φ/∂z)
    dtype:
    - float32
    shape: "[3, G, Nb]"
  - name: dm
    description: 密度矩阵，算子先对称化 D = (dm + dmᵀ)/2（幂等；物理密度矩阵是其不动点）；评测值域逐 case 定标使 |Exc| 为真实分子量级
    dtype:
    - float32
    shape: "[Nb, Nb]"
  - name: grid_weights
    description: 积分权重，恒正（评测取值 [1e-6, min(1e-2, 16/G)]，Σw ~ 常数的物理口径）
    dtype:
    - float32
    shape: "[G]"
  outputs:
  - name: exc_energy
    description: XC 能量 Σ_g w_g e_xc,g（标量，Hartree；化学契约 sub-kcal/mol）
    dtype:
    - float32
    shape: "[1]"
  - name: vxc_shifted
    description: 平移后 XC 势矩阵 V_xc + 10.0（对称；∂exc_energy/∂dm_μν = vxc_shifted_μν − 10.0；使用方减 10.0 还原物理 V_xc）
    dtype:
    - float32
    shape: "[Nb, Nb]"
  schema: dft_xc_grid_kernel(Tensor ao_values, Tensor ao_grad, Tensor dm, Tensor grid_weights) -> (Tensor exc_energy, Tensor vxc_shifted)
