operator:
  name: DqmcHubbardGreens
  category: NumericalStable
  difficulty: L5
  formula: |
    s_l = 2·aux_field[l] − 1 ∈ {−1,+1}^N；K ← (K + K^T)/2（对称化）
    B_l = diag(exp(lam·s_l)) · expm(−dtau·K)                    # expm 为矩阵指数
    A = I + B_Ltau · B_{Ltau-1} ⋯ B_1
    greens = A^{-1}，sign = sgn(det A) ∈ {−1,+1}，logdet = log|det A|
    （朴素连乘在 fp32 下必然上溢，须用 QR-UDT 稳定化链，见 desc §2）
  description: 行列式量子蒙特卡洛（DQMC/BSS）等时 Green 函数 + 行列式符号与对数行列式，指数动态范围序列积的 QR-UDT 稳定化
  shape_support: "aux_field [Ltau, N] int8（0/1），kinetic [N, N] float32；输出 greens [N, N] float32、sign [1] int32、logdet [1] float32"
  # 阈值用仓库 checker (kernel_eval.utils.compare.compare_tensors, native=plain golden)
  # 实测确定。plain golden 即 fp32 稳定化链（bench 数据通路，重正交组按 desc §2
  # 可行性规则自适应、上限 8）——greens 是矩阵逆，fp32 误差沿全矩阵均布而 |G| 元素
  # 随机过零，过零点附近的相对误差尖峰由小值域/相消兜底处理，native 与被测同为
  # fp32 路径时兜底比较才公平（fp64 native 会使兜底零容忍，任何真实 fp32 实现必挂）。
  # 校准：plain vs fp64 oracle 在全部 100 case x 6 draw（N>200 取 4 draw，共 554
  # draw）双跑，checker(float32=0.05) 全量判 passed；实测 greens 正常值域 MERE
  # ≤2.6e-3、max|dG| ≤2.1e-3、logdet MERE ≤4.3e-4。取 float32 0.05（与同为"误差
  # 全矩阵均布"类的 batched_svd 先例一致）：MERE 留 ≥19x 裕量。四上界同时取满的
  # 角点（N≥100 且 Ltau≥128 且 lam=0.5 且 dtau=0.125，实测 fp32 误差进入百分位）
  # 不在 case 空间内。校准同时断言 sign 三方一致（plain / 独立路径 fp32 实现（E 经
  # 对称本征分解）/ fp64，554/554）与 sigma_min(M_inner) > 1e-5 余量（实测全部
  # draw ≥5.1e-4）。sign 为 int32 零容差（一步丢符号输出翻号即失败）。
  precision_thresholds:
    float32: 0.05
    int32: 0
  attrs:
  - name: lam
    type: float
    description: Hubbard-Stratonovich 耦合常数 λ（评测取值范围 [0.1, 0.5]）
    required: true
  - name: dtau
    type: float
    description: 虚时间步长 Δτ（评测取值范围 [0.05, 0.125]）
    required: true
  - name: stab_interval
    type: int
    default: 8
    description: 重正交（QR 重分解）间隔上限——kernel 可更频繁重正交（fp32 下组内动态范围受工作精度约束，见 desc §2），不影响数学结果（任意节奏下输出一致）
    required: false
  inputs:
  - name: aux_field
    description: Hubbard-Stratonovich 辅助场（0 → s=−1，1 → s=+1），Ltau 个虚时间片
    dtype:
    - int8
    shape: "[Ltau, N]"
  - name: kinetic
    description: 动能矩阵 K，算子内部对称化 K ← (K+K^T)/2（评测取值范围 [-1, 1]）
    dtype:
    - float32
    shape: "[N, N]"
  outputs:
  - name: greens
    description: 等时 Green 函数 G = (I + B_Ltau⋯B_1)^{-1}
    dtype:
    - float32
    shape: "[N, N]"
  - name: sign
    description: 行列式符号 sgn(det A) ∈ {−1, +1}（int32 零容差精确比对）
    dtype:
    - int32
    shape: "[1]"
  - name: logdet
    description: 对数行列式 log|det A|
    dtype:
    - float32
    shape: "[1]"
  schema: dqmc_hubbard_greens(Tensor aux_field, Tensor kinetic, float lam, float dtau, int stab_interval=8) -> (Tensor greens, Tensor sign, Tensor logdet)
