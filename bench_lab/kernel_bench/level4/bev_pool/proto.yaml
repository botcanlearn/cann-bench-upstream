operator:
  name: BevPool
  category: FusedComposite
  difficulty: L4
  formula: |
    对每个视锥点 i ∈ [0, P):
      w_i = depth.flatten()[ranks_depth[i]]                    # gather 深度权重 (标量)
      v_i = feat.reshape(N_cam*fH*fW, C)[ranks_feat[i], :]     # gather 特征行 [C]
      out.reshape(bev_h*bev_w, C)[ranks_bev[i], :] += w_i * v_i  # 乘权后 scatter-add 到 BEV 网格
  description: BEVPoolV2 风格视锥特征池化算子，gather 深度与特征、逐点相乘后 scatter-add 聚合到 BEV 网格，ranks 无序、kernel 需处理写冲突
  shape_support: "depth [N_cam, D, fH, fW]，feat [N_cam, fH, fW, C]，ranks_depth/ranks_feat/ranks_bev [P]，输出 bev_feat [bev_h, bev_w, C]"
  attrs:
  - name: bev_h
    type: int
    description: BEV 网格高度
    required: true
  - name: bev_w
    type: int
    description: BEV 网格宽度
    required: true
  inputs:
  - name: depth
    description: 视锥深度分布预测（DepthNet softmax 输出，取值 [0, 1]）
    dtype:
    - float16
    - float32
    shape: "[N_cam, D, fH, fW]"
  - name: feat
    description: 相机图像特征（channel-last）
    dtype:
    - float16
    - float32
    shape: "[N_cam, fH, fW, C]"
  - name: ranks_depth
    description: 每个视锥点在 depth 展平后的线性索引，取值范围 [0, N_cam*D*fH*fW - 1]，由 value_range 保证合法
    dtype:
    - int32
    shape: "[P]"
  - name: ranks_feat
    description: 每个视锥点在 feat 展平为 [N_cam*fH*fW, C] 后的行索引，取值范围 [0, N_cam*fH*fW - 1]，由 value_range 保证合法
    dtype:
    - int32
    shape: "[P]"
  - name: ranks_bev
    description: 每个视锥点落入的 BEV 网格线性索引，取值范围 [0, bev_h*bev_w - 1]，无序且可重复（写冲突来源），由 value_range 保证合法
    dtype:
    - int32
    shape: "[P]"
  outputs:
  - name: bev_feat
    description: BEV 网格特征（fp32 累加后转回输入 dtype），未被任何点命中的网格为 0
    dtype:
    - float16
    - float32
    shape: "[bev_h, bev_w, C]"
  schema: bev_pool(Tensor depth, Tensor feat, Tensor ranks_depth, Tensor ranks_feat, Tensor ranks_bev, int bev_h, int bev_w) -> Tensor bev_feat
