operator:
  name: TridiagonalSolve
  category: NumericalStable
  difficulty: L4
  formula: |
    求解 batch 三对角线性方程组 T @ x = b_rhs，T 由 (dl, d, du) 三条对角线定义:
      dl[b,i] * x[b,i-1,k] + d[b,i] * x[b,i,k] + du[b,i] * x[b,i+1,k] = b_rhs[b,i,k]
    Thomas 算法 (前向消元 + 回代):
      c'_0 = du_0 / d_0,  d'_0 = b_0 / d_0
      c'_i = du_i / (d_i - dl_i * c'_{i-1})
      d'_i = (b_i - dl_i * d'_{i-1}) / (d_i - dl_i * c'_{i-1})
      x_{N-1} = d'_{N-1},  x_i = d'_i - c'_i * x_{i+1}
  description: 批量三对角线性方程组求解算子，输入严格对角占优保证消元数值稳定，kernel 侧预期用 PCR/CR 并行消元
  shape_support: "dl/d/du [B, N]，b_rhs [B, N, K]，输出 x [B, N, K]"
  attrs: []
  inputs:
  - name: dl
    description: 下对角线（sub-diagonal），首元素 dl[:, 0] 按约定忽略（不参与计算），评测用例 value_range [-1, 1]
    dtype:
    - float32
    - float16
    shape: "[B, N]"
  - name: d
    description: 主对角线，评测用例 value_range [4, 6]，与 dl/du 共同构成严格对角占优（|d| ≥ 4 > |dl|+|du| ≤ 2），保证消元数值稳定
    dtype:
    - float32
    - float16
    shape: "[B, N]"
  - name: du
    description: 上对角线（super-diagonal），末元素 du[:, N-1] 按约定忽略（不参与计算），评测用例 value_range [-1, 1]
    dtype:
    - float32
    - float16
    shape: "[B, N]"
  - name: b_rhs
    description: 右端项，K 个右端向量共享同一系数矩阵
    dtype:
    - float32
    - float16
    shape: "[B, N, K]"
  outputs:
  - name: x
    description: 解向量，满足 T @ x = b_rhs，dtype 与输入一致
    dtype:
    - float32
    - float16
    shape: "[B, N, K]"
  schema: tridiagonal_solve(Tensor dl, Tensor d, Tensor du, Tensor b_rhs) -> Tensor x
