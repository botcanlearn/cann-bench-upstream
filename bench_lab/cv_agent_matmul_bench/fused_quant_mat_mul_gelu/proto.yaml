operator:
  name: FusedQuantMatMul
  category: FusedComposite
  formula: 'acc = matmul_int8_int8_acc_int32(x1, x2)

    qbmmout = float32(acc) * x2Scale.reshape(1, N)

    qbmmout = qbmmout * x1Scale.reshape(M, 1)

    qbmmout = qbmmout + bias.reshape(1, N)

    out = bfloat16(gelu_erf(qbmmout))

    '
  description: 'A8W8、x1 per-token、x2 per-channel、BF16 浮点 bias、gelu_erf

    和 BF16 输出融合路径。所有 shape 共用同一接口和通用 Kernel；

    实现必须根据运行时 M/K/N 与硬件资源生成自适应 tiling，不得按

    benchmark case 写死切分参数。

    '
  shape_support: 'x1: [M,K] int8, ND, no transpose

    x2: [K,N] int8, ND, no transpose

    x1Scale: [M] float32, per-token

    x2Scale: [N] bfloat16, per-channel

    bias: [N] bfloat16

    out: [M,N] bfloat16

    M,K,N must be positive; K <= 65535; N <= 65535

    '
  attrs: []
  inputs:
  - name: x1
    description: shape 为 [M,K] 的 INT8 量化激活矩阵。
    dtype:
    - int8
  - name: x2
    description: shape 为 [K,N] 的 INT8 量化权重矩阵。
    dtype:
    - int8
  - name: x1Scale
    description: shape 为 [M] 的 FP32 per-token scale。
    dtype:
    - float32
  - name: x2Scale
    description: shape 为 [N] 的 BF16 per-channel scale。
    dtype:
    - bfloat16
  - name: bias
    description: shape 为 [N]、在反量化后相加的 BF16 浮点 bias。
    dtype:
    - bfloat16
  outputs:
  - name: out
    description: shape 为 [M,N] 的 BF16 gelu_erf 输出。
    dtype:
    - bfloat16
  schema: fused_quant_mat_mul(Tensor x1, Tensor x2, Tensor x1Scale, Tensor x2Scale, Tensor bias) -> Tensor out
  difficulty: L3
precision:
  outputs:
  - name: out
    dtype: bfloat16
    threshold_rule: output_dtype
