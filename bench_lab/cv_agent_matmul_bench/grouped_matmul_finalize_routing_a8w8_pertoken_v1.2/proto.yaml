operator:
  name: GroupedMatmulFinalizeRouting
  category: Contraction
  formula: "acc_i = matmul_int8_int8_acc_int32(x1[group_i, :], x2[i, :, :])\nrouted[t, :] = float32(acc[t, :]) * scale[expert(t), :] \\\n               * pertokenScaleOptional[t] * logit[t]\nout = zeros([output_bs, N], float32)\nout[sharedInputOffset:sharedInputOffset + L, :] += \\\n    float32(sharedInput) * sharedInputWeight\nout.index_add_(dim=0, index=rowIndex, source=routed)\n"
  description: 'Atlas A2/A3 的 WeightNzV2 A8W8、per-token/per-channel 与

    finalize-routing 融合路径。所有 case 固定使用同一套接口和 Kernel

    模板，由运行时根据 M/E 自适应选择 tiling。AscendC 只实现

    grouped_matmul_finalize_routing，Golden 使用同名纯算子入口。

    '
  implementation_target: grouped_matmul_finalize_routing
  implementation_schema: "grouped_matmul_finalize_routing(\n  Tensor x1, Tensor x2, Tensor scale, Tensor pertokenScaleOptional,\n  Tensor groupList, Tensor sharedInput, Tensor logit, Tensor rowIndex,\n  int output_bs,\n  float sharedInputWeight=1.0, int sharedInputOffset=0\n) -> Tensor out\n"
  shape_support: "x1: [M,2048] int8, ND, no transpose\nx2: logical [E,2048,7168] int8 in benchmark; real operator input must\n    be converted with torch_npu.npu_format_cast(x2_npu, 29) and use\n    FRACTAL_NZ storage\nscale: [E,7168] float32, per-channel\npertokenScaleOptional: [M] float32, per-token\ngroupList: [E] int64, cumsum mode\nsharedInput: [L,7168] bfloat16\nlogit: [M] float32\nrowIndex: [M] int64, values in [0, output_bs)\nout: [output_bs,7168] float32\n1 <= E <= 256, 1 <= M <= 131072\n1 <= output_bs <= M\n1 <= L and 0 <= sharedInputOffset\nsharedInputOffset + L <= output_bs\ngroupList is nonnegative and nondecreasing, and groupList[-1] = M\n"
  attrs:
  - name: output_bs
    description: runner 用于构造 ACLNN out.shape[0] 的必填元数据。
    type: int
  - name: sharedInputWeight
    description: sharedInput 分支在合入 out 前使用的乘数。
    type: float
    default: 1.0
  - name: sharedInputOffset
    description: sharedInput 第一行放置到 out 中的行偏移。
    type: int
    default: 0
  - name: row_index_values
    type: ListInt
    description: row_index_values（自动补全）
    required: 'false'
  - name: group_list_values
    type: ListInt
    description: group_list_values（自动补全）
    required: 'false'
  - name: deterministic
    type: bool
    description: deterministic（自动补全）
    required: 'false'
  runner_attrs:
  - name: group_list_values
    description: runner 在调用 Golden 前写入 groupList Tensor 的确定值。
    type: list[int]
    target_input: groupList
  - name: row_index_values
    description: runner 在调用 Golden 前写入 rowIndex Tensor 的确定值。
    type: list[int]
    target_input: rowIndex
  - name: deterministic
    description: runner 调用期间使用的确定性运行模式，不传给 Golden。
    type: bool
    default: false
    runtime_setting: deterministic
  inputs:
  - name: x1
    description: shape 为 [M,2048] 的 INT8 路由激活矩阵，行已按专家分组。
    dtype:
    - int8
  - name: x2
    description: 'shape 为 [E,2048,7168] 的逻辑 INT8 专家权重。真实 WeightNzV2 输入为

      FRACTAL_NZ；生成算子的 PyTorch 适配层必须调用

      torch_npu.npu_format_cast(x2_npu, 29) 完成转换，禁止直接传入 ND x2。

      '
    dtype:
    - int8
  - name: scale
    description: shape 为 [E,7168] 的 FP32 per-channel 反量化因子。
    dtype:
    - float32
  - name: pertokenScaleOptional
    description: shape 为 [M] 的 FP32 per-token 反量化因子。
    dtype:
    - float32
  - name: groupList
    description: shape 为 [E] 的 INT64 cumsum 专家分组边界。
    dtype:
    - int64
  - name: sharedInput
    description: shape 为 [L,7168] 的 BF16 共享专家输出。
    dtype:
    - bfloat16
  - name: logit
    description: shape 为 [M] 的 FP32 上游路由权重。
    dtype:
    - float32
  - name: rowIndex
    description: shape 为 [M] 的 INT64 finalize scatter-add 索引，取值范围为 [0, output_bs)。
    dtype:
    - int64
  outputs:
  - name: out
    description: shape 为 [output_bs,7168] 的 FP32 combine 结果。
    dtype:
    - float32
  schema: "grouped_matmul_finalize_routing(\n  Tensor x1, Tensor x2, Tensor scale, Tensor pertokenScaleOptional,\n  Tensor groupList, Tensor sharedInput, Tensor logit, Tensor rowIndex,\n  int output_bs,\n  float sharedInputWeight=1.0, int sharedInputOffset=0\n) -> Tensor out\n"
  difficulty: L3
precision:
  outputs:
  - name: out
    dtype: float32
    threshold_rule: intermediate_dtype_inherited
    intermediate_dtype: float32
