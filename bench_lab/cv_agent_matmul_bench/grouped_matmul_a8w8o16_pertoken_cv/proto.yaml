operator:
  name: GroupedMatmul
  category: Contraction
  formula: "for expert i:\n  Xi = x[group_start:group_end]\n  accumulator = Xi.int32 @ weight[i].int32\n  dequantized = accumulator.float32 * scale[i].float32\n  Yi = dequantized * perTokenScale[group_start:group_end, None].float32\n  y[group_start:group_end] = cast(Yi, bfloat16)\n"
  description: Atlas A3 aclnnGroupedMatmulV5 A8W8O16 BF16 per-token C->V path implemented by GMM_QUANT_BF16, GMM_CV_SPLIT_IMP, and GMMQuantMixCoreCompute. This benchmark fixes cumsum groupList, ND non-transposed weight, no bias, no offset, no activation, int8 x/weight, bfloat16 per-channel scale, float32 per-token scale, and bfloat16 output.
  shape_support: 'x: [M, K] int8

    weight: [E, K, N] int8

    scale: [E, N] bfloat16

    groupList: [E] int64 cumsum

    perTokenScale: [M] float32

    y: [M, N] bfloat16

    '
  attrs:
  - name: group_list_values
    description: deterministic cumsum group list used by golden and data preparation
    type: ListInt
    default: null
  inputs:
  - name: x
    description: routed activation tokens
    dtype:
    - int8
  - name: weight
    description: expert weight tensor
    dtype:
    - int8
  - name: scale
    description: bfloat16 per-expert per-channel dequant scale
    dtype:
    - bfloat16
  - name: groupList
    description: cumsum token boundary list
    dtype:
    - int64
  - name: perTokenScale
    description: per-token activation dequant scale
    dtype:
    - float32
  outputs:
  - name: y
    description: bfloat16 grouped matmul dequantized output
    dtype:
    - bfloat16
  schema: grouped_matmul(Tensor x, Tensor weight, Tensor scale, Tensor groupList, Tensor perTokenScale, list[int]? group_list_values=None) -> Tensor y
  difficulty: L3
precision:
  outputs:
  - name: y
    dtype: bfloat16
    threshold_rule: output_dtype
