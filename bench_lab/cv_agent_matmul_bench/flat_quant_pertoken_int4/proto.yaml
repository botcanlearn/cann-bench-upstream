operator:
  name: FlatQuant
  category: Contraction
  formula: 'x1 = x @ kroneckerP2

    x2 = kroneckerP1 @ x1

    quantScale[k] = max(abs(x2[k, :, :])) / (7 / clipRatio)

    out = saturate_int4(rint(x2 / quantScale.reshape(K, 1, 1)))

    '
  description: 'Atlas A2/A3 FlatQuant 的 BF16、per-token INT4、tiling key=1

    (MM_BASE_MODE) 融合路径。

    '
  shape_support: "x: [K,M,N] bfloat16, 1 <= K <= 262144, 1 <= M,N <= 256\nkroneckerP1: [M,M] bfloat16\nkroneckerP2: [N,N] bfloat16\nout: [K,M,N] physical signed int4, N must be even\nquantScale: [K] float32\nbenchmark cases are restricted to tiling key=1 / MM_BASE_MODE:\n  mAlign = ceil_div(M,16)*16, nAlign = ceil_div(N,16)*16\n  M != 1\n  not (mAlign <= 64 and nAlign <= 128 and K > 1)\n  mAlign <= 128 and nAlign <= 128\n  mAlign^2 + nAlign^2 + 4*mAlign*nAlign <= 262144\n"
  attrs:
  - name: clipRatio
    description: 必选裁剪比例，取值范围为 (0,1]；Golden 仅将显式传入的 None 兜底为 1.0。
    type: float
  inputs:
  - name: x
    description: shape 为 [K,M,N] 的 BF16 输入。
    dtype:
    - bfloat16
  - name: kroneckerP1
    description: shape 为 [M,M] 的 BF16 左乘矩阵。
    dtype:
    - bfloat16
  - name: kroneckerP2
    description: shape 为 [N,N] 的 BF16 右乘矩阵。
    dtype:
    - bfloat16
  outputs:
  - name: out
    description: 真实接口输出为物理 signed INT4；Golden/比较器解包后以 INT8 承载逻辑值。
    dtype:
    - int4
  - name: quantScale
    description: shape 为 [K] 的 FP32 per-token 量化因子。
    dtype:
    - float32
  schema: flat_quant(Tensor x, p1, p2, clipRatio)
  difficulty: L3
precision:
  outputs:
  - name: out
    dtype: int4
    threshold_rule: int8_three_tier
    int8_thresholds:
      fatal_abs_diff: 2
      tolerance_abs_diff: 1
      bit_exact_ratio: 0.995
  - name: quantScale
    dtype: float32
    threshold_rule: input_dtype_inherited
    mare_multiplier: 10
    threshold_per_input_dtype:
      bfloat16: 2^-7
