operator:
  name: QuantGroupedMatmulDequant
  category: Contraction
  formula: xScale=rowmax(abs(x))/127; xq=round(x/xScale); out_i=(xq_i @ wq_i)*weightScale_i*xScale_i  (bias 恒 0)
  description: 对齐主线 aclnnQuantGroupedMatmulDequant (ops-transformer/gmm/quant_grouped_matmul_dequant) 的公式4.1+动态pertoken场景。V 侧对浮点 x 动态 per-token 量化，C 侧 grouped INT8 matmul，V 侧按 (xq@weight+bias)*weightScale*xScale 反量化(bias 文档公式 L47 含 scale 前加; 文档 L166 当前实现要求 null, case 不带 bias, golden 保留计算)，out = x dtype。主线 transposeWeight 强制 true、x 仅 FLOAT16、out = x dtype；本 benchmark 保留 fp16/bf16 覆盖。
  shape_support: 'x: [M,K] float16/bfloat16 (主线仅 FLOAT16)

    quantized_weight: [G,N,K] int8 (transposeWeight 强制 true)

    weightScale: [G,N] float32

    groupList: [G] int64 (cumsum 边界)

    out: [M,N] (= x dtype)

    '
  attrs:
  - name: group_list_values
    type: ListInt
  - name: groupListType
    type: int
    default: 0
  - name: quant_mode
    type: str
    default: pertoken
  - name: transposeWeight
    type: bool
    default: true
  inputs:
  - name: x
    description: 未量化激活(主线 FLOAT16)
    dtype:
    - float16
  - name: quantized_weight
    description: INT8 量化权重 [G,N,K](transposeWeight=true)
    dtype:
    - int8
  - name: weightScale
    description: per-channel 权重 scale
    dtype:
    - float32
  - name: groupList
    description: cumsum 分组边界
    dtype:
    - int64
  outputs:
  - name: out
    description: 反量化输出(= x dtype)
    dtype:
    - float16
    - bfloat16
  schema: quant_grouped_matmul_dequant(Tensor x, Tensor quantized_weight, Tensor weightScale, Tensor groupList, Tensor? bias=None, str quant_mode="pertoken", Tensor? xScaleOptional=None, transposeWeight, groupListType, group_list_values) -> Tensor out
  difficulty: L3
precision:
  outputs:
  - name: out
    dtype: float32
    threshold_rule: input_dtype_inherited
    threshold_per_input_dtype:
      bfloat16: 2^-7
      float16: 2^-10
