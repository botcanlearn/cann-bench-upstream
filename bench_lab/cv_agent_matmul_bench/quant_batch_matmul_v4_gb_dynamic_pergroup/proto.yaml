operator:
  name: QuantBatchMatmulV4
  category: Contraction
  formula: out[m,n] = bias[n] + sum_j (x1_blk @ x2_blk) * x1Scale[m,j] * x2Scale[floor(n/128),j]  (静态已量化输入, 无在线量化)
  description: 对齐主线 aclnnQuantMatmulV5 (ops-nn/matmul/quant_batch_matmul_v4) 的 G-B pergroup 静态量化场景。消费已量化 INT8 x1/x2 + 预存 FLOAT32 x1Scale/x2Scale，沿 K 按 128 分组 block matmul 累加反量化，加 bias，输出 bf16。主线 transposeX2=true、N%256==0、K%512==0。
  shape_support: 'x1: [M,K] int8 (已量化, transposeX1=false)

    x2: [N,K] int8 (已量化, transposeX2=true)

    x1_scale: [M, ceil(K/128)] float32 (预计算)

    x2_scale: [ceil(N/128), ceil(K/128)] float32 (预计算, 文档 shape N-group 在前)

    bias: [N] float32

    out: [M,N] bfloat16

    '
  attrs:
  - name: variant
    type: str
    default: GB_STATIC_PERGROUP
  - name: transpose_x1
    type: bool
    default: false
  - name: transpose_x2
    type: bool
    default: true
  - name: group_size
    type: ListInt
    default:
    - 1
    - 128
    - 128
  inputs:
  - name: x1
    description: 已量化 INT8 左矩阵 [M,K]
    dtype:
    - int8
  - name: x2
    description: 已量化 INT8 右矩阵 [N,K] (transposeX2=true)
    dtype:
    - int8
  - name: x1_scale
    description: pergroup scale 沿 K, [M, ceil(K/128)]
    dtype:
    - float32
  - name: x2_scale
    description: pergroup-perblock scale, [ceil(N/128), ceil(K/128)]
    dtype:
    - float32
  - name: bias
    description: 浮点 bias [N]
    dtype:
    - float32
  outputs:
  - name: out
    description: 反量化累加输出
    dtype:
    - bfloat16
  schema: quant_batch_matmul_v4(Tensor x1, Tensor x2, Tensor x1_scale, Tensor x2_scale, Tensor bias, str variant="GB_STATIC_PERGROUP", transpose_x1, transpose_x2, list[int] group_size=[1,128,128]) -> Tensor out
  difficulty: L3
precision:
  outputs:
  - name: out
    dtype: bfloat16
    threshold_rule: output_dtype
