operator:
  name: QuantBatchMatmulInplaceAdd
  category: Contraction
  formula: y[m,n] = yRef[m,n] + sum_j (x1_blk @ x2_blk) * scale1[m,j] * scale2[j,n]  (gsK=32, 真实 fp8 + E8M0)
  description: 对齐主线 aclnnQuantBatchMatmulInplaceAdd (ops-nn/matmul/quant_batch_matmul_inplace_add) 的 MX mxFP8 静态量化场景。消费真实 fp8 x1/x2(torch.float8_e4m3fn) + 预存 E8M0 scale(uint8 字节，解码 2^(raw-127))，沿 K 按 32 分组 block matmul 乘 scale 反量化，inplace 累加到 yRef，输出 fp32。主线 transposeX1=true/transposeX2=false、scale 末维=2、仅 950。
  shape_support: 'x1: [K,M] float8_e4m3fn (主线 FLOAT8_E4M3FN, transposeX1=true)

    x2: [K,N] float8_e4m3fn (主线 FLOAT8_E4M3FN, transposeX2=false)

    x1_scale: [ceil(K/64),M,2] uint8 (主线 FLOAT8_E8M0, 预存)

    x2_scale: [ceil(K/64),N,2] uint8 (主线 FLOAT8_E8M0, 预存)

    yRef/y: [M,N] float32 (inplace add)

    '
  attrs:
  - name: variant
    type: str
    default: MX_STATIC
  - name: transposeX1
    type: bool
    default: true
  - name: transposeX2
    type: bool
    default: false
  - name: groupSize
    type: int
    default: 32
  inputs:
  - name: x1
    description: 已量化 fp8 左矩阵(主线 FLOAT8_E4M3FN)
    dtype:
    - float8_e4m3fn
  - name: x2
    description: 已量化 fp8 右矩阵(主线 FLOAT8_E4M3FN)
    dtype:
    - float8_e4m3fn
  - name: x1_scale
    description: 预存 E8M0 scale(uint8 字节, golden 解码 2^(raw-127))
    dtype:
    - uint8
  - name: x2_scale
    description: 预存 E8M0 scale(uint8 字节, golden 解码 2^(raw-127))
    dtype:
    - uint8
  - name: yRef
    description: inplace add 初始值
    dtype:
    - float32
  outputs:
  - name: y
    description: inplace 累加结果
    dtype:
    - float32
  schema: quant_batch_matmul_inplace_add(Tensor x1, Tensor x2, Tensor x1_scale, Tensor x2_scale, Tensor yRef, str variant="MX_STATIC", bool transposeX1=true, bool transposeX2=false, int groupSize=32) -> Tensor y
  difficulty: L3
precision:
  outputs:
  - name: y
    dtype: float32
    threshold_rule: output_dtype
