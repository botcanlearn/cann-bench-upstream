operator:
  name: QuantGroupedMatmulInplaceAdd
  category: Contraction
  formula: y_i = yRef_i + (x1_i @ x2) * scale2_i * scale1_i
  description: 对齐主线 aclnnQuantGroupedMatmulInplaceAdd (ops-transformer/gmm/quant_grouped_matmul_inplace_add) 的 T-C 量化场景。x1/x2 用 en_dtypes.hifloat8 真实量化(已安装 en_dtypes 0.0.4,golden 内 numpy round-trip + float matmul 对齐主线 L0C fp32 累加)；yRef 3D (g,M,N) inplace；x2 2D 单权重 (K,N)；scale2(channel)×scale1(tensor) 反量化累加到 yRef。主线 x1/x2=HIFLOAT8、groupSize 恒 0、仅 950。
  shape_support: 'x1: [M,K] hifloat8(en_dtypes.hifloat8 真实量化, golden numpy round-trip)

    x2: [K,N] hifloat8(en_dtypes.hifloat8, 主线单权重 2D)

    scale1: [G,1] float32 (tensor 级)

    scale2: [G,N] float32 (channel 级)

    groupList: [G] int64 (cumsum 边界)

    yRef/y: [G,M,N] float32 (主线 3D inplace)

    '
  attrs:
  - name: group_list_values
    type: ListInt
  - name: groupListType
    type: int
    default: 0
  - name: group_size
    type: int
    default: 0
  - name: variant
    type: str
    default: TC_PERCHANNEL
  inputs:
  - name: x1
    description: 激活(主线 HIFLOAT8)
    dtype:
    - float8_e4m3fn
  - name: x2
    description: 权重(主线 HIFLOAT8 单权重 2D)
    dtype:
    - float8_e4m3fn
  - name: scale1
    description: tensor 级左 scale
    dtype:
    - float32
  - name: scale2
    description: per-channel 右 scale
    dtype:
    - float32
  - name: groupList
    description: cumsum 分组边界
    dtype:
    - int64
  - name: yRef
    description: inplace add 初始值(主线 3D)
    dtype:
    - float32
  outputs:
  - name: y
    description: inplace 累加结果(3D)
    dtype:
    - float32
  schema: quant_grouped_matmul_inplace_add(Tensor x1, Tensor x2, Tensor scale1, Tensor scale2, Tensor groupList, Tensor yRef, int groupListType=0, int group_size=0, variant, group_list_values) -> Tensor y
  difficulty: L3
precision:
  outputs:
  - name: y
    dtype: float32
    threshold_rule: output_dtype
