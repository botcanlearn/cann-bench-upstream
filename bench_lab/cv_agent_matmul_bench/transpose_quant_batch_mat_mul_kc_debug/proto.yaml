operator:
  name: TransposeQuantBatchMatMul
  category: Contraction
  formula: out = permute((permute(x1) @ permute(x2)) * x1Scale * x2Scale + bias, permY)
  description: C->V transpose quant batch matmul K-C path.
  shape_support: 'x1: [B,M,K] or [B,K,M] int8

    x2: [B,K,N] or [B,N,K] int8

    x1Scale: [B,M] float32

    x2Scale/bias: [B,N] float32

    out: [B,M,N] or [B,N,M] float32'
  attrs:
  - name: permX1
    type: ListInt
    default:
    - 0
    - 1
    - 2
  - name: permX2
    type: ListInt
    default:
    - 0
    - 1
    - 2
  - name: permY
    type: ListInt
    default:
    - 0
    - 1
    - 2
  - name: groupSize
    type: int
    default: 0
  - name: batchSplitFactor
    type: int
    default: 1
  - name: y_dtype
    type: str
    default: float32
  inputs:
  - name: x1
    dtype:
    - int8
  - name: x2
    dtype:
    - int8
  - name: x1Scale
    dtype:
    - float32
  - name: x2Scale
    dtype:
    - float32
  - name: bias
    dtype:
    - float32
  outputs:
  - name: out
    dtype:
    - float32
  schema: transpose_quant_batch_mat_mul(Tensor x1, Tensor x2, Tensor x1Scale, Tensor x2Scale, Tensor bias, list[int] permX1, list[int] permX2, list[int] permY, int groupSize=0, batchSplitFactor, y_dtype) -> Tensor out
  difficulty: L3
precision:
  outputs:
  - name: out
    dtype: float32
    threshold_rule: output_dtype
