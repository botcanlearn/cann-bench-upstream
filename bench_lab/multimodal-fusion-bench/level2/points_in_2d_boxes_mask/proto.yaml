operator:
  name: PointsIn2DBoxesMask
  category: Geometry
  difficulty: L2
  formula: mask = (u >= x1) & (u < x2) & (v >= y1) & (v < y2)
  description: 判断二维图像平面点是否落入二维检测框内，输出布尔掩码
  shape_support: 支持points_2d为(N,2)/(B,N,2)，boxes_2d为(4)/(K,4)/(B,4)/(B,K,4)
  attrs:
  - name: image_width
    type: int
    default: null
    description: 图像宽度
  - name: image_height
    type: int
    default: null
    description: 图像高度
  - name: use_image_bounds
    type: bool
    default: true
    description: 是否同时要求点位于图像边界内
  note: 框右下边界为开区间，即x2和y2不包含在框内
  inputs:
  - name: points_2d
    description: 二维点坐标，最后一维为(u,v)
    dtype:
    - float16
    - float32
    - float64
    - int32
    - int64
  - name: boxes_2d
    description: 二维框，格式为[x1,y1,x2,y2]
    dtype:
    - float16
    - float32
    - float64
    - int32
    - int64
  outputs:
  - name: mask
    description: 点是否位于对应二维框内的布尔掩码
    dtype:
    - bool
  schema: points_in_2d_boxes_mask(Tensor points_2d, Tensor boxes_2d, int image_width, int image_height, bool use_image_bounds=True) -> Tensor mask
