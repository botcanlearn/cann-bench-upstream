operator:
  name: FusedRMSNormPosQKVQKNorm
  category: Fusion
  difficulty: L3
  formula: |
    h = rmsnorm(x, gamma) + pos_emb
    q, k, v = linear(h, Wqkv) split into 3
    q = rmsnorm(q, gamma_q)
    k = rmsnorm(k, gamma_k)
    return (q, k, v)
  description: RMSNorm + 位置编码 + QKV投影 + QK归一化的融合算子
  shape_support: 'x: [B, S, D], gamma: [D], pos_emb: [1, S, D], Wqkv: [D, 3*H], gamma_q: [H], gamma_k: [H]'
  attrs:
  - name: num_heads
    type: Int
    description: 注意力头数
    required: true
  - name: eps
    type: Float
    default: 1.0e-6
    description: RMSNorm epsilon
    required: false
  inputs:
  - name: x
    description: 输入隐状态 [B, S, D]
    dtype:
    - float16
    - bfloat16
  - name: gamma
    description: RMSNorm权重 [D]
    dtype:
    - float16
    - bfloat16
  - name: pos_emb
    description: 位置编码 [1, S, D]
    dtype:
    - float16
    - bfloat16
  - name: Wqkv
    description: QKV投影权重 [D, 3*H]
    dtype:
    - float16
    - bfloat16
  - name: gamma_q
    description: Q归一化权重 [H]
    dtype:
    - float16
    - bfloat16
  - name: gamma_k
    description: K归一化权重 [H]
    dtype:
    - float16
    - bfloat16
  outputs:
  - name: q
    description: 归一化后的Q [B, S, H]
    dtype:
    - float16
    - bfloat16
  - name: k
    description: 归一化后的K [B, S, H]
    dtype:
    - float16
    - bfloat16
  - name: v
    description: V [B, S, H]
    dtype:
    - float16
    - bfloat16
  schema: fused_rmsnorm_pos_qkv_qknorm(Tensor x, Tensor gamma, Tensor pos_emb,
    Tensor Wqkv, Tensor gamma_q, Tensor gamma_k, int num_heads, float eps) -> (Tensor q, Tensor k, Tensor v)
