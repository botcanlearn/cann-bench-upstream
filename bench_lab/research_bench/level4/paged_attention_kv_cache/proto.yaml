operator:
  name: PagedAttentionKvCache
  category: FusedComposite
  difficulty: L4
  formula: "output = softmax(q @ reconstruct(k_cache, page_table)^T / sqrt(D) + causal_mask) @ reconstruct(v_cache, page_table)"
  description: 从分页 K/V cache 重建上下文并执行支持 GQA 的 attention
  shape_support: "q: [B,Sq,Hq,D], k/v cache: [Blocks,Page,Hkv,D], page_table: [B,MaxBlocks]"
  attrs:
  - name: causal
    type: bool
    default: true
    description: 是否应用右对齐 causal mask
    required: false
  inputs:
  - name: q
    description: query 张量
    dtype:
    - float16
    - bfloat16
    - float32
    shape: "[B, Sq, Hq, D]"
  - name: k_cache
    description: 分页 K cache
    dtype:
    - float16
    - bfloat16
    - float32
    shape: "[num_blocks, page_block_size, Hkv, D]"
  - name: v_cache
    description: 分页 V cache
    dtype:
    - float16
    - bfloat16
    - float32
    shape: "[num_blocks, page_block_size, Hkv, D]"
  - name: cache_seqlens
    description: 每个 batch 的有效 KV 长度
    dtype:
    - int32
    - int64
    shape: "[B]"
  - name: page_table
    description: 逻辑页到物理页映射
    dtype:
    - int32
    - int64
    shape: "[B, max_blocks_per_seq]"
  outputs:
  - name: output
    description: attention 输出
    dtype:
    - float16
    - bfloat16
    - float32
    shape: "[B, Sq, Hq, D]"
  schema: paged_attention_kv_cache(Tensor q, Tensor k_cache, Tensor v_cache, Tensor cache_seqlens, Tensor page_table, bool causal=True) -> Tensor output
