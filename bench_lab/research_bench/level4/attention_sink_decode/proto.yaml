operator:
  name: AttentionSinkDecode
  category: FusedComposite
  difficulty: L4
  formula: output = softmax(q @ concat(sink_k, k)^T / sqrt(D) + mask) @ concat(sink_v,
    v)
  description: decode 阶段带 attention sink token 的 scaled dot-product attention
  shape_support: 'q: [B,Sq,H,D], k/v: [B,Skv,H,D], sink_k/sink_v: [B,Sink,H,D]'
  attrs:
  - name: causal
    type: bool
    default: true
    description: 普通 KV 部分是否应用右对齐 causal mask，sink token 始终可见
    required: false
  inputs:
  - name: q
    description: query 张量
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Sq, H, D]'
  - name: k
    description: 普通 key cache 张量
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Skv, H, D]'
  - name: v
    description: 普通 value cache 张量
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Skv, H, D]'
  - name: sink_k
    description: attention sink key 张量
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Sink, H, D]'
  - name: sink_v
    description: attention sink value 张量
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Sink, H, D]'
  outputs:
  - name: output
    description: attention 输出
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Sq, H, D]'
  schema: attention_sink_decode(Tensor q, Tensor k, Tensor v, Tensor sink_k, Tensor
    sink_v, bool causal=True) -> Tensor output
