operator:
  name: MultiQueryAttentionDecode
  category: FusedComposite
  difficulty: L4
  formula: output = softmax(q @ k^T / sqrt(D) + causal_mask) @ v, where k/v use one
    shared KV head
  description: decode 阶段 Multi-Query Attention，单路 K/V 共享到多路 query heads
  shape_support: 'q: [B,Sq,Hq,D], k/v: [B,Skv,D]'
  attrs:
  - name: causal
    type: bool
    default: true
    description: 是否应用右对齐 causal mask
    required: false
  inputs:
  - name: q
    description: query 张量
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Sq, Hq, D]'
  - name: k
    description: 共享 key cache 张量
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Skv, D]'
  - name: v
    description: 共享 value cache 张量
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Skv, D]'
  outputs:
  - name: output
    description: attention 输出
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Sq, Hq, D]'
  schema: multi_query_attention_decode(Tensor q, Tensor k, Tensor v, bool causal=True)
    -> Tensor output
