operator:
  name: SlidingWindowAttentionDecode
  category: FusedComposite
  difficulty: L4
  formula: output = softmax(q @ k^T / sqrt(D) + sliding_window_causal_mask) @ v
  description: decode 阶段滑动窗口 attention，仅保留最近 window_size 个 KV token
  shape_support: 'q: [B,Sq,H,D], k/v: [B,Skv,H,D]'
  attrs:
  - name: window_size
    type: int
    default: 128
    description: 每个 query 可见的最近 KV token 数量
    required: false
  - name: causal
    type: bool
    default: true
    description: 是否禁止看未来 token
    required: false
  inputs:
  - name: q
    description: query 张量
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Sq, H, D]'
  - name: k
    description: key cache 张量
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Skv, H, D]'
  - name: v
    description: value cache 张量
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Skv, H, D]'
  outputs:
  - name: output
    description: attention 输出
    dtype:
    - float16
    - bfloat16
    - float32
    shape: '[B, Sq, H, D]'
  schema: sliding_window_attention_decode(Tensor q, Tensor k, Tensor v, int window_size=128,
    bool causal=True) -> Tensor output
