operator:
  name: WindowAttention2D
  category: FusedComposite
  difficulty: L4
  formula: "partition 2D windows; y = softmax(q @ k^T / sqrt(Dh) + position_bias) @ v; reverse windows"
  description: 2D window partition、窗口内多头 attention 和 reverse window 的融合语义
  shape_support: "x: [B,H,W,C], qkv_weight: [3C,C], position_bias: [num_heads, window_h*window_w, window_h*window_w]"
  attrs:
  - {name: window_h, type: int, default: 7, required: false, description: window height}
  - {name: window_w, type: int, default: 7, required: false, description: window width}
  - {name: num_heads, type: int, default: 4, required: false, description: attention head count}
  inputs:
  - {name: x, description: NHWC 2D token 输入, dtype: [float16, bfloat16, float32], shape: "[B,H,W,C]"}
  - {name: qkv_weight, description: QKV projection weight, dtype: [float16, bfloat16, float32], shape: "[3C,C]"}
  - {name: qkv_bias, description: 可选 QKV projection bias, dtype: [float16, bfloat16, float32], shape: "[3C]", optional: true}
  - {name: position_bias, description: 可选相对位置偏置, dtype: [float16, bfloat16, float32], shape: "[num_heads,N,N]", optional: true}
  outputs:
  - {name: y, description: window attention 输出, dtype: [float16, bfloat16, float32], shape: "[B,H,W,C]"}
  schema: window_attention_2d(Tensor x, Tensor qkv_weight, Tensor? qkv_bias=None, Tensor? position_bias=None, int window_h=7, int window_w=7, int num_heads=4) -> Tensor y
