operator:
  name: TabularFeatureTokenizer
  category: FusedComposite
  difficulty: L2
  formula: tokens = concat(x_num[...,None] * num_weight + bias, cat_table[x_cat], dim=1)
  description: Tabular 模型输入层，将数值/类别特征转换为 token
  shape_support: "x_num: [B,F_num], x_cat: [B,F_cat], num_weight: [F_num,D], cat_table: [C,D]"
  attrs:
  - {name: unknown_id, type: int, default: 0, description: invalid category replacement id, required: false}
  inputs:
  - {name: x_num, description: 数值特征, dtype: [float16, bfloat16, float32]}
  - {name: x_cat, description: 类别 id, dtype: [int32, int64]}
  - {name: num_weight, description: 数值特征投影权重, dtype: [float16, bfloat16, float32]}
  - {name: cat_table, description: 类别 embedding table, dtype: [float16, bfloat16, float32]}
  - name: bias
    description: 数值特征 bias
    dtype: [float16, bfloat16, float32]
    optional: true
  outputs:
  - {name: tokens, description: token 输出, dtype: [float16, bfloat16, float32]}
  schema: tabular_feature_tokenizer(Tensor x_num, Tensor x_cat, Tensor num_weight, Tensor cat_table, Tensor? bias=None, int unknown_id=0) -> Tensor tokens
