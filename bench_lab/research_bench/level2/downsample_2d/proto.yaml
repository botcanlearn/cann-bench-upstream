operator:
  name: Downsample2D
  category: FusedComposite
  difficulty: L2
  formula: y = avg_pool2d(x, kernel_size, stride, padding)
  description: 对 NCHW 特征图执行 2D average pooling 下采样
  shape_support: 'x: [B,C,H,W], y: pooled NCHW'
  attrs:
  - name: kernel_h
    type: int
    default: 2
    description: 池化窗口高度
    required: false
  - name: kernel_w
    type: int
    default: 2
    description: 池化窗口宽度
    required: false
  - name: stride_h
    type: int
    default: 2
    description: 高度方向 stride
    required: false
  - name: stride_w
    type: int
    default: 2
    description: 宽度方向 stride
    required: false
  - name: pad_h
    type: int
    default: 0
    description: 高度方向 padding
    required: false
  - name: pad_w
    type: int
    default: 0
    description: 宽度方向 padding
    required: false
  inputs:
  - name: x
    description: 输入特征图
    dtype: &id001
    - float16
    - bfloat16
    - float32
    shape: '[B,C,H,W]'
  outputs:
  - name: y
    description: average pooling 下采样输出
    dtype: *id001
    shape: '[B,C,Ho,Wo]'
  schema: downsample_2d(Tensor x, int kernel_h=2, int kernel_w=2, int stride_h=2,
    int stride_w=2, int pad_h=0, int pad_w=0) -> Tensor y
