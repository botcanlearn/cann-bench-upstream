operator:
  name: QkRmsNorm
  category: FusedComposite
  difficulty: L2
  formula: q_out = q / sqrt(mean(q^2) + eps) * gamma_q; k_out = k / sqrt(mean(k^2) + eps) * gamma_k
  description: Attention 前处理中的 Q/K 双路 RMSNorm 融合算子
  shape_support: "q: [..., Dq], k: [..., Dk], gamma_q: [Dq], gamma_k: [Dk]"
  attrs:
  - name: eps
    type: float
    default: 1.0e-6
    description: RMSNorm 数值稳定项，必须大于 0
    required: false
  inputs:
  - name: q
    description: Query 张量
    dtype: [float16, bfloat16, float32]
  - name: k
    description: Key 张量
    dtype: [float16, bfloat16, float32]
  - name: gamma_q
    description: Query RMSNorm 缩放参数，shape 为 [Dq]
    dtype: [float16, bfloat16, float32]
  - name: gamma_k
    description: Key RMSNorm 缩放参数，shape 为 [Dk]
    dtype: [float16, bfloat16, float32]
  outputs:
  - name: q_out
    description: Query RMSNorm 输出
    dtype: [float16, bfloat16, float32]
  - name: k_out
    description: Key RMSNorm 输出
    dtype: [float16, bfloat16, float32]
  schema: qk_rms_norm(Tensor q, Tensor k, Tensor gamma_q, Tensor gamma_k, float eps=1e-6) -> (Tensor q_out, Tensor k_out)
