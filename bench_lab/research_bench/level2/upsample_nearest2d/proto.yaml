operator:
  name: UpsampleNearest2D
  category: Transform
  difficulty: L2
  formula: y[b,c,oh,ow] = x[b,c,floor(oh/scale_h),floor(ow/scale_w)]
  description: 对 NCHW 特征图执行 2D nearest neighbor 上采样
  shape_support: 'x: [B,C,H,W], y: [B,C,out_h,out_w]'
  attrs:
  - name: scale_h
    type: int
    default: 2
    description: 高度整数放大倍数
    required: false
  - name: scale_w
    type: int
    default: 2
    description: 宽度整数放大倍数
    required: false
  inputs:
  - name: x
    description: 输入特征图
    dtype: &id001
    - float16
    - bfloat16
    - float32
    shape: '[B,C,H,W]'
  outputs:
  - name: y
    description: nearest 上采样输出
    dtype: *id001
    shape: '[B,C,H*scale_h,W*scale_w]'
  schema: upsample_nearest2d(Tensor x, int scale_h=2, int scale_w=2) -> Tensor y
