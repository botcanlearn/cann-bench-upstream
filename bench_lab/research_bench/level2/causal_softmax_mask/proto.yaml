operator:
  name: CausalSoftmaxMask
  category: FusedComposite
  difficulty: L2
  formula: y = softmax((scores * scale + mask).masked_fill(causal_invalid, -inf), dim=-1)
  description: Attention score 的 scale、causal mask、padding/additive mask 与 softmax 融合
  shape_support: "scores: [B, H, Sq, Skv], attention_mask: broadcastable to scores"
  attrs:
  - name: scale
    type: float
    default: 1.0
    description: score 缩放系数
    required: false
  - name: causal
    type: bool
    default: true
    description: 是否应用右对齐 causal mask
    required: false
  inputs:
  - name: scores
    description: attention score 张量
    dtype: [float16, bfloat16, float32]
  - name: attention_mask
    description: 可选 mask；bool mask 中 True 表示保留，浮点 mask 为 additive mask
    dtype: [bool, float16, bfloat16, float32]
    optional: true
  outputs:
  - name: y
    description: softmax 输出
    dtype: [float16, bfloat16, float32]
  schema: causal_softmax_mask(Tensor scores, Tensor? attention_mask=None, float scale=1.0, bool causal=true) -> Tensor y
