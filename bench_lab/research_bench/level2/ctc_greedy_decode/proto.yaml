operator:
  name: CtcGreedyDecode
  category: Reduction
  difficulty: L2
  formula: "tokens = ctc_collapse(argmax(logits, dim=-1), blank_id, merge_repeated)"
  description: OCR/语音 CTC greedy decode，输出 padded tokens 与有效长度
  shape_support: "logits: [B,T,V], input_lengths: [B]"
  attrs:
  - {name: blank_id, type: int, default: 0, required: false, description: blank token id}
  - {name: merge_repeated, type: bool, default: true, required: false, description: 是否合并连续重复 token}
  - {name: pad_id, type: int, default: -1, required: false, description: 输出 padding token id}
  inputs:
  - {name: logits, description: CTC logits, dtype: [float16, bfloat16, float32], shape: "[B,T,V]"}
  - {name: input_lengths, description: 每个 batch 的有效 T 长度, dtype: [int32, int64], shape: "[B]"}
  outputs:
  - {name: tokens, description: padded decode token ids, dtype: [int32], shape: "[B, max_decoded_len]"}
  - {name: lengths, description: 每个 batch 的 decoded token 数, dtype: [int32], shape: "[B]"}
  schema: ctc_greedy_decode(Tensor logits, Tensor input_lengths, int blank_id=0, bool merge_repeated=true, int pad_id=-1) -> (Tensor tokens, Tensor lengths)
