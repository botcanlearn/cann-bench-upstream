operator:
  name: RotaryEmbeddingDecode
  category: FusedComposite
  difficulty: L2
  formula: apply RoPE to q/k by gathering cos/sin with position_ids
  description: Decode / prefill 场景 RoPE，覆盖 position id、partial rotary dim 和 interleaved layout
  shape_support: "q: [B,S,Hq,D], k: [B,S,Hk,D], cos/sin: [MaxPos,R/2], position_ids: [B,S]"
  attrs:
  - name: rotary_dim
    type: int
    default: -1
    description: 旋转维度；-1 表示使用完整 head dim
    required: false
  - name: interleaved
    type: bool
    default: false
    description: 是否使用偶/奇交错布局
    required: false
  inputs:
  - name: q
    description: Query 张量
    dtype: [float16, bfloat16, float32]
  - name: k
    description: Key 张量
    dtype: [float16, bfloat16, float32]
  - name: cos
    description: cos 位置表，shape 为 [MaxPos, rotary_dim/2]
    dtype: [float16, bfloat16, float32]
  - name: sin
    description: sin 位置表，shape 为 [MaxPos, rotary_dim/2]
    dtype: [float16, bfloat16, float32]
  - name: position_ids
    description: position id，shape 为 [B, S]
    dtype: [int32, int64]
  outputs:
  - name: q_out
    description: 应用 RoPE 后的 Query
    dtype: [float16, bfloat16, float32]
  - name: k_out
    description: 应用 RoPE 后的 Key
    dtype: [float16, bfloat16, float32]
  schema: rotary_embedding_decode(Tensor q, Tensor k, Tensor cos, Tensor sin, Tensor position_ids, int rotary_dim=-1, bool interleaved=false) -> (Tensor q_out, Tensor k_out)
