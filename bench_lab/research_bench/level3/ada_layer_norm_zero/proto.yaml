operator:
  name: AdaLayerNormZero
  category: FusedComposite
  difficulty: L3
  formula: y = layer_norm(x) * (1 + scale(cond)) + shift(cond); gate = gate(cond)
  description: Diffusion/DiT 中由条件向量调制 LayerNorm 的融合算子
  shape_support: "x: [B,T,D], cond: [B,C], proj_weight: [3D,C]"
  attrs:
  - {name: eps, type: float, default: 1.0e-6, description: LayerNorm epsilon, required: false}
  inputs:
  - {name: x, description: token 输入, dtype: [float16, bfloat16, float32]}
  - {name: cond, description: 条件向量, dtype: [float16, bfloat16, float32]}
  - {name: ln_weight, description: LayerNorm gamma, dtype: [float16, bfloat16, float32]}
  - {name: ln_bias, description: LayerNorm beta, dtype: [float16, bfloat16, float32]}
  - {name: proj_weight, description: conditioning projection weight, dtype: [float16, bfloat16, float32]}
  - name: proj_bias
    description: conditioning projection bias
    dtype: [float16, bfloat16, float32]
    optional: true
  outputs:
  - {name: y, description: 调制输出, dtype: [float16, bfloat16, float32]}
  - {name: gate, description: gate 输出, dtype: [float16, bfloat16, float32]}
  schema: ada_layer_norm_zero(Tensor x, Tensor cond, Tensor ln_weight, Tensor ln_bias, Tensor proj_weight, Tensor? proj_bias=None, float eps=1e-6) -> (Tensor y, Tensor gate)
