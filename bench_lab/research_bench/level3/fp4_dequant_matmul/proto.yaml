operator:
  name: Fp4DequantMatmul
  category: Contraction
  difficulty: L3
  formula: "y = x @ dequant_fp4_e2m1(w_packed, scales).T"
  description: 固定 FP4 E2M1 编码的权重解包、反量化和矩阵乘融合
  shape_support: "x: [..., K], w_packed: [ceil(N*K/2)], scales: [N, ceil(K/block_size)]"
  attrs:
  - {name: out_features, type: int, required: true, description: 输出特征 N}
  - {name: in_features, type: int, required: true, description: 输入特征 K}
  - {name: block_size, type: int, default: 16, required: false, description: scale block size}
  inputs:
  - {name: x, description: activation 输入, dtype: [float16, bfloat16, float32], shape: "[..., K]"}
  - {name: w_packed, description: 两个 FP4 code 打包到一个 uint8, dtype: [uint8], shape: "[ceil(N*K/2)]"}
  - {name: scales, description: per-output per-block scale, dtype: [float16, bfloat16, float32], shape: "[N, ceil(K/block_size)]"}
  outputs:
  - {name: y, description: matmul 输出, dtype: [float16, bfloat16, float32], shape: "[..., N]"}
  schema: fp4_dequant_matmul(Tensor x, Tensor w_packed, Tensor scales, int out_features, int in_features, int block_size=16) -> Tensor y
