operator:
  name: PatchEmbedding2D
  category: FusedComposite
  difficulty: L3
  formula: y = conv2d(x, weight, bias, stride, padding); optional flatten + transpose
  description: OCR/VLM/ViT 图像输入层 patch projection 与 token layout transform
  shape_support: "x: [B,C,H,W], weight: [E,C,patch_h,patch_w], bias: [E] or None"
  attrs:
  - {name: stride_h, type: int, default: 16, description: height stride, required: false}
  - {name: stride_w, type: int, default: 16, description: width stride, required: false}
  - {name: pad_h, type: int, default: 0, description: height padding, required: false}
  - {name: pad_w, type: int, default: 0, description: width padding, required: false}
  - {name: flatten, type: bool, default: true, description: "whether output [B,N,E]", required: false}
  inputs:
  - name: x
    description: 输入图像 NCHW
    dtype: [float16, bfloat16, float32]
  - name: weight
    description: patch projection 权重
    dtype: [float16, bfloat16, float32]
  - name: bias
    description: 可选 bias
    dtype: [float16, bfloat16, float32]
    optional: true
  outputs:
  - name: y
    description: patch embedding 输出
    dtype: [float16, bfloat16, float32]
  schema: patch_embedding_2d(Tensor x, Tensor weight, Tensor? bias=None, int stride_h=16, int stride_w=16, int pad_h=0, int pad_w=0, bool flatten=true) -> Tensor y
