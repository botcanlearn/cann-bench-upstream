operator:
  name: BboxDecodeAndFilter
  category: Vision
  difficulty: L3
  formula: decoded = apply_deltas(anchors,deltas); keep_mask = scores >= score_threshold
  description: 将 anchor boxes 与 bbox deltas 解码为预测框，并输出按 score threshold 过滤的 mask
  shape_support: 'anchors/deltas: [N,4], scores: [N], outputs decoded_boxes [N,4],
    keep_mask [N]'
  attrs:
  - name: score_threshold
    type: float
    default: 0.05
    description: 保留候选框的分数阈值
    required: false
  - name: max_shape_h
    type: float
    default: 1024.0
    description: decode 后 box y 坐标裁剪上界
    required: false
  - name: max_shape_w
    type: float
    default: 1024.0
    description: decode 后 box x 坐标裁剪上界
    required: false
  inputs:
  - name: anchors
    description: anchor boxes，格式 [x1,y1,x2,y2]
    dtype: &id001
    - float16
    - bfloat16
    - float32
    shape: '[N,4]'
  - name: deltas
    description: bbox deltas，格式 [dx,dy,dw,dh]
    dtype: *id001
    shape: '[N,4]'
  - name: scores
    description: 候选框分数
    dtype: *id001
    shape: '[N]'
  outputs:
  - name: decoded_boxes
    description: decode 后 boxes
    dtype: *id001
    shape: '[N,4]'
  - name: keep_mask
    description: score 过滤 mask
    dtype:
    - bool
    shape: '[N]'
  schema: bbox_decode_and_filter(Tensor anchors, Tensor deltas, Tensor scores, float
    score_threshold=0.05, float max_shape_h=1024.0, float max_shape_w=1024.0) -> (Tensor
    decoded_boxes, Tensor keep_mask)
