# Python env spec for the cann-bench-eval image (uv project mode).
# STRICT SUPERSET of docker/base/pyproject.toml -- the eval image `uv sync --frozen`s this into the
# SAME /opt/venv the base already populated. Superset matters: `uv sync` reconciles the env to the
# lock, so anything the base installed but this lock omitted would be UNINSTALLED (torch, 2.4G).
# Keep the base's entries byte-identical when bumping either file.
#
# The delta over the base is what kernel_eval itself imports but the direct-launch base never needed:
#   pandas          report tables / op_summary aggregation
#   ruamel.yaml     cases.yaml round-trip
#   protobuf        torch_npu.profiler export
#   tornado         torch_npu profiler dependency
#   expecttest      torch testing helper pulled in by the eval path
#   torchvision     golden for roi_align / nms  (pyproject [optional-dependencies].vision)
#   en_dtypes       golden for MX quant (bench_lab add_rms_norm_dynamic_mx_quant)

[project]
name = "cann-bench-eval"
version = "0"
requires-python = "==3.13.*"
dependencies = [
    # ---- identical to docker/base/pyproject.toml ----
    "torch==2.10.0",
    "torch-npu==2.10.0.post2",
    "numpy", "pyyaml", "decorator", "attrs", "scipy", "cloudpickle", "ml-dtypes", "psutil",
    "filelock", "typing-extensions", "sympy", "networkx", "jinja2", "fsspec", "mpmath", "markupsafe",
    "pip", "setuptools", "wheel", "build",
    # ---- eval-only delta ----
    "pandas",
    "ruamel.yaml>=0.18",
    "protobuf",
    "tornado",
    "expecttest",
    "torchvision",
    "en_dtypes>=0.0.4",
]

# Default index = canonical PyPI. Mirror at lock time (`uv lock --default-index <mirror>`) or let the
# Dockerfile sed the lock for --frozen builds -- same hashes, so mirroring keeps reproducibility.
# torch/torchvision come from the +cpu index (the NPU path never uses CUDA).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.uv]
package = false
# torch_npu is linux-only (no mac/win wheels); scope the lock so resolution never fails off-linux.
environments = ["sys_platform == 'linux'"]
